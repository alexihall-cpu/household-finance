<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Kodu Finance</title>

<!-- Firebase (compat SDK — simplest syntax to configure) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- PapaParse — robust CSV parsing (handles quoted fields, different delimiters) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- pdf.js — extracts text from PDF statements entirely in the browser, nothing uploaded -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<link rel="stylesheet" href="/kodu/kodu-fonts.css">
<link rel="stylesheet" href="/kodu/kodu-tokens.css">
<link rel="stylesheet" href="/kodu/kodu-components.css">
<style>
  /* Tokens V1 (1.0.0-rc2) comes from kodu/. blue is ink now; --accent is for smart things only. */
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-sans); font-size:16px; line-height:1.45;}
  h1,h2,h3{margin:0; font-weight:600;}
  input,select,button,textarea{font-family:inherit;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{cursor:pointer;}

  /* ---------- layout ---------- */
  #app{display:none; min-height:100vh;}
  #app.ready{display:block;}
  .appver{font-weight:400; font-size:var(--type-caption-size); color:var(--ink-2);}
  .more-list{display:flex; flex-direction:column;}
  .more-link{background:none; border:none; border-bottom:1px solid var(--line); text-align:left; padding:14px 4px; font-size:var(--type-body-size); color:var(--ink);}
  .k-tabbar{display:flex;}
  .k-tab{flex:1 1 auto; min-width:var(--tap); padding:8px 4px; font-size:12px;}
  .k-tab[aria-current="page"]::before{left:20%; right:20%;}
  .k-side-link{cursor:pointer;}
  a.k-avatar, a.k-side-link, a.k-tab, #top-avatar{text-decoration:none !important;}
  .k-mark__tile{background:var(--app-finance-tile, var(--app-finance));}
  @media (min-width:900px){ .k-main > main{max-width:1120px; margin:0; padding:var(--space-5) var(--space-8);} .phone-only{display:none !important;} }
  header .signout{background:none; border:none; color:var(--ink-2); font-size:12px; text-decoration:underline; margin-left:10px;}

  main{flex:1; padding:18px; max-width:720px; margin:0 auto; width:100%;}
  .view{display:none;}
  .view.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; margin-bottom:14px;}
  .card h2{font-size:14px; margin-bottom:12px;}
  .muted{color:var(--ink-2); font-size:14px; line-height:1.5;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .spacer{flex:1;}
  .dash-top{display:flex; flex-direction:column; gap:var(--space-3); margin-bottom:var(--space-3);}
  .dash-top>.k-card{margin-bottom:0;}
  .dash-top>.card{flex:1;}
  @media (min-width:760px){
    .dash-top{flex-direction:row; align-items:stretch;}
  }

  .btn{
    background:var(--ink); color:var(--bg); border:none; border-radius:var(--radius-md); padding:9px 14px;
    font-size:13px; font-weight:600;
  }
  .btn.secondary{background:var(--surface); color:var(--ink); border:1px solid var(--control-border);}
  .btn.danger{background:var(--negative);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    border:1px solid var(--control-border); border-radius:var(--radius-md); padding:8px 10px; width:100%; font-size:16px; background:var(--surface); color:var(--ink);
  }
  label{font-size:var(--type-label-size); color:var(--ink-2); display:block; margin-bottom:4px; font-weight:var(--type-label-weight); text-transform:uppercase; letter-spacing:var(--type-label-tracking); font-family:var(--font-mono);}
  .field{margin-bottom:12px;}
  label:has(input[type=checkbox]){font-family:var(--font-sans); text-transform:none; letter-spacing:0; font-size:var(--type-small-size); color:var(--ink); font-weight:400;}

  /* auth */
  #auth-screen{
    display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px;
  }
  #auth-screen .box{width:100%; max-width:340px;}
  #auth-screen h1{font-size:20px; margin-bottom:4px;}
  #auth-screen .muted{margin-bottom:20px;}
  #auth-error{color:var(--negative); font-size:12px; margin-top:8px; min-height:16px;}
  #config-warning{
    display:none; background:var(--negative-tint); color:var(--negative); border:1px solid var(--negative);
    border-radius:var(--radius-md); padding:12px 14px; font-size:12px; max-width:480px; margin:40px auto; line-height:1.6;
  }

  /* dashboard */
  .ring-wrap{display:flex; align-items:center; gap:16px; margin-bottom:6px;}
  .ring{width:74px; height:74px; border-radius:50%; flex-shrink:0; position:relative;}
  .ring::after{content:""; position:absolute; inset:11px; border-radius:50%; background:var(--surface);}
  .ring .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; z-index:1;}

  /* budgets */
  .bar-row{margin-bottom:14px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .bar-row .top .name{font-weight:600;}
  .bar-row .top .amt{color:var(--ink-2);}
  .bar-track{height:9px; background:var(--fill); border-radius:var(--radius-xs); overflow:hidden;}
  .bar-fill{height:100%; background:var(--ink);}
  .bar-fill.over{background:var(--negative);}

  /* upload */
  .dropzone{
    border:2px dashed var(--line); border-radius:8px; padding:24px; text-align:center;
    margin-bottom:14px; background:var(--surface);
  }
  .dropzone.drag{border-color:var(--ink); background:var(--fill);}
  table{width:100%; border-collapse:collapse; font-size:var(--type-data-size);}
  td.mono, td:has(.amt-neg), td:has(.amt-pos){text-align:right;}
  th,td{text-align:left; padding:6px 4px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-2); font-weight:600; text-transform:uppercase; font-size:var(--type-label-size); letter-spacing:var(--type-label-tracking); font-family:var(--font-mono); font-weight:var(--type-label-weight);}
  td select{padding:4px 6px; font-size:11px;}
  .amt-neg{color:var(--ink);}
  .amt-pos{font-variant-numeric:tabular-nums;} .amt-neg,.mono{font-variant-numeric:tabular-nums;}
  .amt-pos{color:var(--positive);}
  tr.dup-row{background:var(--negative-tint);}
  .dup-tag{
    display:inline-block; background:var(--negative); color:var(--bg); font-size:var(--type-label-size); font-weight:600;
    padding:2px 5px; border-radius:var(--radius-xs); letter-spacing:.03em; margin-right:4px; vertical-align:middle;
  }

  /* bills */
  .bill{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .bill:last-child{border-bottom:none;}
  .bill .name{font-weight:600; font-size:13px;}
  .bill .sub{font-size:11px; color:var(--ink-2);}
  .bill .days{font-weight:700; font-size:13px;}
  .bill .days.soon{color:var(--warn);}
  .bill .actions{display:flex; gap:6px; margin-top:4px;}
  .bill .actions button{font-size:11px; padding:4px 8px;}

  /* phone: transactions as rows, not a wide table (table only from 900px) */
  @media (max-width:899px){
    #view-transactions table:has(#txn-rows) thead, #preview-card thead{display:none;}
    #view-transactions table:has(#txn-rows), #txn-rows, #preview-rows, #preview-card table{display:block;}
    #txn-rows tr, #preview-rows tr{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:12px 0; border-bottom:1px solid var(--line);}
    #txn-rows td, #preview-rows td{border:none; padding:0;}
    #txn-rows td:nth-child(2), #preview-rows td:nth-child(2){order:-1; flex:1 1 100%;}
    #txn-rows td:nth-child(2) input, #preview-rows td:nth-child(2) input{width:100% !important;}
    #txn-rows td:last-child, #preview-rows td:last-child{margin-left:auto;}
  }
  /* shared-component adapters (no inline styles) */
  .k-card{display:block; margin-bottom:var(--space-3);}
  .k-card h2{font-size:var(--type-body-strong-size); margin-bottom:12px;}
  .btn-xs{min-height:32px; padding:0 8px; font-size:12px;}
  .btn-xs{min-height:28px; padding:4px 7px; font-size:12px;} .btn-del{color:var(--negative); border-color:var(--negative);} .mr-4{margin-right:4px;}
  .pad-sm{padding:6px 10px;} .pad-xs{padding:4px 6px;} .w-amt{width:96px;} .w-date{width:140px;} .w-auto{width:auto;} .w-full{width:100%;}
  .mb-3{margin-bottom:var(--space-3);} .mb-10{margin-bottom:10px;} .mb-6{margin-bottom:6px;} .mb-14{margin-bottom:14px;}
  .mt-2{margin-top:var(--space-2);} .mt-4{margin-top:4px;} .mt-6{margin-top:6px;} .mt-10{margin-top:10px;} .mt-14{margin-top:14px;} .mt-n6{margin-top:-6px;} .ml-2{margin-left:var(--space-2);}
  .gap-14{gap:14px;} .fx1{flex:1;} .mw120{min-width:120px;} .mw140{min-width:140px;} .ox{overflow-x:auto; -webkit-overflow-scrolling:touch;} .aic{align-items:center;} .ta-r{text-align:right;} .c-ink2{color:var(--ink-2);}
  .month-label{text-align:center; font-weight:600; font-size:var(--type-small-size);} .fs-20{font-size:20px; font-weight:600;}
  .link-btn{border:none; background:none; color:var(--ink); cursor:pointer; text-decoration:underline; font-size:12px; margin-left:6px;}
  .banner-neg{background:var(--negative-tint); color:var(--negative); border:1px solid var(--negative); border-radius:var(--radius-md); padding:8px 12px; font-size:var(--type-caption-size);}
  .banner-neg.is-hidden{display:none;} .legend{display:flex; gap:16px; margin-top:6px; font-size:var(--type-caption-size); color:var(--ink-2);}
  .k-field{margin-bottom:var(--space-3);}
  .k-field__box input, .k-field__box select, .k-field__box textarea{border:0 !important; padding:0 !important; width:100%; background:transparent !important;}
  .k-field label{margin-bottom:0;}
  /* tables: same control size as fields, nothing clipped */
  td input, td select{font-size:16px !important; min-height:36px; padding:4px 8px !important;}
  @media (pointer:coarse){ td input, td select, .k-btn--sm{min-height:44px;} }
  td input.txn-amt, td input.row-amt, .w-amt{width:112px !important;} td input[type=date], .w-date{width:152px !important;}
  td input.amt-pos, .amt-pos{color:var(--positive) !important;}
  td input.txn-desc{min-width:180px;} td select{min-width:156px;} td input.txn-amt, td input.row-amt{text-align:right;}
  .btn-icon-del{min-width:36px; padding:0 8px; color:var(--ink-2);} .btn-icon-del:hover,.btn-icon-del:focus-visible{color:var(--negative); border-color:var(--negative);}
  canvas{width:100%; height:210px; display:block;}
  /* ---- redesign: shared screen layout ---- */
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .screen{display:flex; flex-direction:column; gap:var(--space-6); padding-bottom:var(--space-8);}
  .stack{display:flex; flex-direction:column; gap:var(--space-3);}
  .between{justify-content:space-between;}
  .hint{color:var(--ink-3); font-size:13px;}
  .tnum{font-variant-numeric:tabular-nums;}
  .figure-lg{font:600 32px/36px var(--font-sans); font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:var(--space-2);}
  .k-toggle{display:flex; align-items:center; gap:var(--space-3); min-height:56px; cursor:pointer;}
  .k-toggle__text{flex:1; display:flex; flex-direction:column;}
  a.k-item, button.k-item{width:100%; text-decoration:none; color:inherit; background:none; border:0; border-bottom:1px solid var(--line); padding:0; text-align:left; cursor:pointer; font:inherit;}
  .k-list > .k-item:last-child{border-bottom:0;}
  .k-item__trail{display:flex; align-items:center; gap:var(--space-2); flex-shrink:0; color:var(--ink-3);}
  .k-item--meter{flex-wrap:wrap; row-gap:10px; padding:14px 0 !important; min-height:0;}
  .k-item--meter .k-meter{flex-basis:100%;}
  .k-list .k-item{padding-top:10px; padding-bottom:10px;}
  a.k-item[aria-current="page"]{background:var(--fill); width:auto; margin:0 calc(var(--space-4) * -1); border-radius:var(--radius-sm); padding-left:var(--space-4) !important; padding-right:var(--space-4) !important;}
  .k-field__box svg{flex-shrink:0; color:var(--ink-3);}
  .k-month button:disabled{opacity:.45; cursor:default;}
  a.k-chip{text-decoration:none; white-space:nowrap;}
  .panes{display:grid; gap:var(--space-6);}
  .panes:not(.is-detail) .pane-detail{display:none;}
  .panes.is-detail .pane-list{display:none;}
  @media (min-width:900px){
    .panes{grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start;}
    .panes:not(.is-detail) .pane-detail, .panes.is-detail .pane-list{display:flex;}
    .panes:not(.is-detail) .pane-detail{display:block;}
    .panes > .pane-detail{position:sticky; top:96px;}
    .hide-desk{display:none !important;}
    .screen .k-month{max-width:360px;}
  }
  @media (max-width:899px){ .hide-phone{display:none !important;} }
  .k-trow{display:grid; grid-template-columns:64px minmax(0,1fr) 150px 190px 112px; align-items:center; gap:var(--space-3); height:44px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer;}
  .k-trow:hover{background:var(--fill);}
  .k-trow--head{height:36px; cursor:default;} .k-trow--head:hover{background:none;}
  .k-trow > :last-child{text-align:right;}
  .k-trow .k-amount{font-size:14px;}
  .k-drop{border:1.5px dashed var(--control-border); border-radius:var(--radius-lg); padding:var(--space-6) var(--space-4); display:flex; flex-direction:column; align-items:center; gap:var(--space-3); text-align:center; color:var(--ink-2); background:var(--surface);}
  .k-cover{display:grid; grid-template-columns:1fr repeat(var(--cols), minmax(0,76px)); align-items:center; font-size:14px;}
  .k-cover > div{min-height:44px; display:flex; align-items:center; border-bottom:1px solid var(--line);}
  .k-cover > div.c{justify-content:center;} .k-cover > .h{min-height:32px;}
  .card-h{font:600 18px/24px var(--font-sans);}
  .grid-2{display:grid; gap:var(--space-6);}
  @media (min-width:900px){ .grid-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start;} }
  .k-list > .k-item-wrap{border-bottom:1px solid var(--line);} .k-list > .k-item-wrap:last-child{border-bottom:0;}
  .k-item-wrap > .k-item{border-bottom:0;}
  .row-edit{padding:0 0 var(--space-4);}
  .k-section{display:flex; flex-direction:column; gap:var(--space-3);}
  .k-section__head{display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-3);}
  .k-section__head h2{font:600 18px/24px var(--font-sans);}
  .hero-figure{font:600 32px/36px var(--font-sans); font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  @media (min-width:900px){ .hero-figure{font:var(--type-figure-xl-weight) var(--type-figure-xl-size)/var(--type-figure-xl-line) var(--font-sans); letter-spacing:-0.02em;} }
  .k-chartbox{display:flex; flex-direction:column; gap:6px;}
  .k-chart{width:100%; height:auto; display:block; overflow:visible;}
  .k-chart path{fill:none; stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round;}
  .k-chart .ch-act{stroke:var(--ink);} .k-chart .ch-fc{stroke:var(--ink-2); stroke-dasharray:6 4;}
  .k-chart line{stroke:var(--line); vector-effect:non-scaling-stroke;} .k-chart .ch-zero{stroke:var(--line-strong);}
  .k-chart__x{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums;}
  .k-legend{display:flex; gap:var(--space-4); font-size:13px; color:var(--ink-2); flex-wrap:wrap;}
  .k-legend i{display:inline-block; width:16px; height:0; border-top:2px solid var(--ink); vertical-align:middle; margin-right:6px;}
  .k-legend i.dash{border-top-style:dashed; border-color:var(--ink-2);}
  details.k-card > summary{list-style:none;} details.k-card > summary::-webkit-details-marker{display:none;}
  .k-label--day{text-transform:none; letter-spacing:0; font:500 13px/18px var(--font-sans);}
  .k-card--hero{display:flex; flex-direction:column; padding:var(--space-5); gap:var(--space-3);}
  .k-card--hero > *{margin:0;}
  .take-lbl{display:block;} @media (min-width:900px){ .take-lbl{display:none;} }
  .k-disc summary{cursor:pointer; min-height:var(--tap); display:flex; align-items:center;}
  .k-disc[open] summary{margin-bottom:var(--space-2);}
  .row-edit{max-width:480px;}
  .sheet-actions{position:sticky; bottom:calc(-1 * (var(--space-6) + env(safe-area-inset-bottom))); display:flex; justify-content:space-between; gap:var(--space-3); background:var(--surface); padding-top:var(--space-3);}
  .k-sheet{gap:var(--space-4);}
  .k-toast{display:flex; align-items:center; gap:var(--space-3);}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--radius-md); font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:50;
  }
  .toast.show{opacity:1;}
  .empty{color:var(--ink-2); font-size:13px; text-align:center; padding:20px 0;}

  /* ---- accounts build (Finance-local, from Accounts V9) ---- */

.k-chip[aria-pressed="true"] .who { background: var(--bg); color: var(--ink); box-shadow: none; }
.k-chip .who { margin-left: -6px; }
.owner-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.owner-row .k-chips { min-width: 0; }
.hit { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 8px; margin: 0 -8px; }
.wrap { max-width: 1040px; }
/* * owner dot: who an account belongs to */
/* initials carry the meaning; filled = joint, outlined = one person. Never tone alone. */
.who { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 99px; font: 600 12px/1 var(--font-sans); background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); flex-shrink: 0; }
.who--joint { background: var(--ink); color: var(--bg); box-shadow: none; }
/* * account tile */
.acct { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.acct__head { display: flex; align-items: center; gap: var(--space-3); }
.acct__name { font: 600 16px/22px var(--font-sans); }
.acct__bank { font-size: 13px; color: var(--ink-2); }
.acct__bal, .figure-md { font: var(--type-figure-md-weight) var(--type-figure-md-size)/var(--type-figure-md-line) var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.acct__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: var(--space-3); }
.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 420px)); gap: var(--space-4); }
.goal-grid { display: grid; gap: var(--space-4); align-items: start; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.flat-list > .k-item { border-bottom: 1px solid var(--line); } .flat-list > .k-item:last-child { border-bottom: 0; }
.mk { cursor: grab; outline: none; } .mk:focus-visible .mk__ring { stroke: var(--focus); stroke-width: 3; }
.hide-desktop {} @media (min-width: 900px) { .hide-desktop { display: none !important; } .owner-row > .k-chips { display: none; } .owner-row:not(:has(> :nth-child(2))) { display: none; } }
.count { display: inline-flex; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--ink); color: var(--bg); font: 600 12px/22px var(--font-sans); justify-content: center; margin-left: 6px; vertical-align: 2px; }
.split3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); border-top: 1px solid var(--line); padding-top: var(--space-3); }
.split3 a { display: flex; gap: 8px; align-items: center; min-height: var(--tap); color: inherit; text-decoration: none; font-size: 13px; }
.split3 a > span:last-child { display: flex; flex-direction: column; white-space: nowrap; } @media (max-width:899px){ .split3 a { flex-direction: column; align-items: flex-start; gap: 4px; } } .split3 b { font-size: 15px; font-weight: 600; }
.acct-list { padding: 0 var(--space-4); gap: 0; }

let uid = null;
let unsubscribers = [];

let bills = [];        // {id, name, amount, dueDate, leadDays, recurrence}

let settingsDoc = { monthlyIncome: null, startBalance: null };
let inboxItems = []; function inboxNeedCount(){ return inboxItems.filter(i => i.status === 'need').length; }

/* ---------------------- ACCOUNTS CORE (v40) ---------------------- */
let accounts = [], statements = [], accIdx = {byId:{}, byName:{}};
const LEGACY_ACCOUNTS = [
  {id:'lloyds-card', name:'Lloyds credit card', bank:'Lloyds', type:'credit', owner:'me', remindStatements:true, order:1},
  {id:'joint-bos', name:'Joint Bank of Scotland', bank:'Bank of Scotland', type:'current', owner:'joint', remindStatements:true, order:2}];
const WHO_KEY = 'kodu-who', WHO_VALUES = ['all','joint','me','partner'];
let whoPick = (() => { try { return localStorage.getItem(WHO_KEY); } catch(e){ return null; } })();
if (!WHO_VALUES.includes(whoPick)) whoPick = null;
function curWho(screen){
  const q = new URLSearchParams(location.search).get('who'); if (WHO_VALUES.includes(q)) return q;
  if (whoPick) return whoPick;
  return ['spending','plan','buys'].includes(screen || routeNow.screen) ? 'joint' : 'all';
}
function setWho(v){
  if (!WHO_VALUES.includes(v)) return; whoPick = v; try { localStorage.setItem(WHO_KEY, v); } catch(e){}
  const u = new URL(location.href); u.searchParams.delete('who'); history.replaceState(history.state, '', u.pathname + u.search); route();
}
function peopleNames(){ const p = (settingsDoc && settingsDoc.people) || {}; return {me: (p.me||'').trim() || 'Me', partner: (p.partner||'').trim() || 'Partner'}; }
function initials(){
  const n = peopleNames(); let a = n.me[0].toUpperCase(), b = n.partner[0].toUpperCase();
  if (a === b){ a = n.me.slice(0,2); a = a[0].toUpperCase() + a.slice(1).toLowerCase(); b = n.partner.slice(0,2); b = b[0].toUpperCase() + b.slice(1).toLowerCase(); }
  return {me:a, partner:b, joint:a[0] + b[0]};
}
function ownerName(o){ const n = peopleNames(); return o === 'joint' ? 'Household' : o === 'me' ? 'Mine' : o === 'partner' ? n.partner + "'s" : 'Everyone'; }
function ownerFull(o){ const n = peopleNames(); return o === 'joint' ? 'Joint, ' + n.me + ' and ' + n.partner : o === 'me' ? n.me : n.partner; }
function whoBadge(o){ const i = initials(); return `<span class="who${o==='joint'?' who--joint':''}" role="img" aria-label="${escapeHtml(ownerFull(o))}">${escapeHtml(i[o]||'')}</span>`; }
function indexAccounts(){
  accIdx = {byId:{}, byName:{}};
  accounts.forEach(a => { accIdx.byId[a.id] = a; if (a.name) accIdx.byName[a.name] = a; });
}
function acctOf(t){ return (t.accountId && accIdx.byId[t.accountId]) || (t.account && accIdx.byName[t.account]) || null; }
function acctName(t){ const a = acctOf(t); return a ? a.name : (t.account || 'Unknown account'); }
function ownerOfTx(t){ const a = acctOf(t); return a ? a.owner : 'joint'; } // old untagged rows still count as household
function txInWho(t, w){
  if (w === 'all') return true;
  if (w === 'joint' && t.countAs === 'household') return true;
  return ownerOfTx(t) === w;
}
function isTransfer(t){ return t.kind === 'transfer'; }
function scopedTx(w){ w = w || curWho(); return transactions.filter(t => !isTransfer(t) && txInWho(t, w)); }
function liveAccounts(){ return accounts.filter(a => !a.archived).sort((x,y) => (x.order||0) - (y.order||0)); }
function acctsOf(o){ return liveAccounts().filter(a => a.owner === o); }
const TYPE_NAME = {current:'Current', credit:'Credit card', savings:'Savings'};
function accountBalance(a){ return typeof a.balance === 'number' ? a.balance : null; }
function ownerTotalOf(o){ return liveAccounts().filter(a => o === 'all' || a.owner === o).reduce((s,a) => s + (accountBalance(a) || 0), 0); }
function hasStatement(a, mk){
  if (statements.some(s => s.accountId === a.id && s.month === mk)) return true;
  return transactions.some(t => t.date && t.date.slice(0,7) === mk && acctOf(t) === a && (t.accountId || t.account));
}
function prevMonthKey(){ return monthKeyAtOffset(-1); }
function waitingAccounts(){ // accounts whose last-month file hasn't arrived (only after the 5th, only once there is any data)
  if (!transactions.length || new Date().getDate() < 5) return [];
  const pk = prevMonthKey();
  return liveAccounts().filter(a => a.remindStatements !== false && a.type !== 'savings' && !hasStatement(a, pk));
}
function lastUpdatedText(a){
  const s = statements.filter(x => x.accountId === a.id && x.importedAt).sort((x,y) => String(y.importedAt).localeCompare(String(x.importedAt)))[0];
  const iso = s ? s.importedAt : (a.balanceDate || null); if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null; const now = new Date();
  const same = d.toDateString() === now.toDateString();
  return same ? 'today ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function backupOk(){ try { return localStorage.getItem('kodu-backup-ok') === '1'; } catch(e){ return false; } }
function virtualAccounts(){ return accounts.some(a => a.virtual); }
/* Empty states (Build Spec V3 §0): what it does, why it's empty, one button that turns it on */
function emptyHtml(what, why, btn){ return `<div class="k-empty"><b>${what}</b>${why || ''}${btn ? `<div style="margin-top:12px">${btn}</div>` : ''}</div>`; }
function backupBtn(){ return `<button class="k-btn k-btn--primary" type="button" data-backup>Download a backup</button>`; }
function addAcctBtn(label, q){ return virtualAccounts() ? backupBtn() : `<a class="k-btn" href="/accounts?sheet=account${q || ''}">${label || 'Add account'}</a>`; }
function startSavings(){ const b = parseFloat(settingsDoc.startBalance) || 0; return b > 0 ? {balance: b, monthly: avgMonthlySpend() > 0 ? derivedMonthlySaving() : 0, comfort: 2000} : null; }
function setupSavings(v){
  if (virtualAccounts()){ toast('Download a backup first.'); return; }
  usersCol().collection('accounts').add({name:'Joint savings', bank:'', type:'savings', owner:'joint', balance:v.balance, balanceDate:new Date().toISOString(), balanceSource:'manual', monthlySaving:v.monthly, comfortLine:v.comfort, remindStatements:false, archived:false, order:accounts.length + 1, rules:{transferPatterns:[], keywordOverrides:{}}}).then(() => toast('Joint savings is set up')).catch(saveFail);

  if (a==='transactions'){ if (!b || !MONTH_RE.test(b)) return {redirect:'/transactions/'+m0}; return {screen:'transactions', month:b}; }
  if (a==='accounts') return {screen:'accounts'};
  if (a==='inbox' || a==='statements' || a==='upload') return b==='check' ? {screen:'check'} : (a!=='inbox' ? {redirect:'/inbox'} : {screen:'inbox'});
  if (a==='plan'){ if (!b) return {screen:'plan'}; if (b==='bills') return {screen:'bills'}; if (b==='buys') return {screen:'buys'}; if (b==='planned') return {screen:'planned'}; if (b==='income') return {screen:'income'}; return {redirect:'/plan'}; }

  return `<div class="k-month"><button class="month-prev" aria-label="Previous month">${icon('prev')}</button><div class="k-month__label">${escapeHtml(monthLabel(mk))}</div><button class="month-next" aria-label="Next month"${atMax?' disabled':''}>${icon('next')}</button></div>`;
}
function skeleton(){ return '<div class="stack"><div class="k-skeleton" style="height:120px"></div><div class="k-skeleton" style="height:56px"></div><div class="k-skeleton" style="height:56px"></div><div class="k-skeleton" style="height:56px"></div></div>'; }
let dataReady = {categories:false, transactions:false, bills:false, planned:false};

// toast with an Undo action (6 s)
let undoTimer = null;
function toastUndo(msg, undo){
  let el = document.getElementById('toast-undo'); if (el) el.remove(); clearTimeout(undoTimer);
  el = document.createElement('div'); el.id = 'toast-undo'; el.className = 'k-toast'; el.setAttribute('role','status');
  el.innerHTML = `<span>${escapeHtml(msg)}</span><button class="k-toast__action" type="button">Undo</button>`;
  el.querySelector('button').onclick = () => { clearTimeout(undoTimer); el.remove(); Promise.resolve(undo()).catch(()=>toast("Couldn't save. Check your connection and try again.")); };
  document.body.appendChild(el); undoTimer = setTimeout(() => el.remove(), 6000);
}
function saveFail(){ toast("Couldn't save. Check your connection and try again."); }

/* ---------------------- SPENDING + CATEGORY ---------------------- */
function normCat(s){ return (s||'').trim().toLowerCase(); }
function catScopeOk(c, w){ if (w === 'all') return true; const sc = c.scope || 'household'; return w === 'joint' ? sc === 'household' : (sc === 'personal' && c.owner === w); }
function actualForCategory(catName, w, mk){
  w = w || curWho('spending'); mk = mk || selectedMonth;
  return scopedTx(w).filter(t => normCat(t.category) === normCat(catName) && t.date && t.date.slice(0,7) === mk).reduce((s,t) => s + Math.abs(t.amount), 0);
}
function spendByAccount(w, mk){
  const m = {}; scopedTx(w).filter(t => t.date && t.date.slice(0,7) === mk && t.amount < 0).forEach(t => { const a = acctOf(t), k = a ? a.id : 'unknown'; m[k] = (m[k]||0) + Math.abs(t.amount); });
  return Object.keys(m).map(k => ({acc: accIdx.byId[k] || null, name: accIdx.byId[k] ? accIdx.byId[k].name : 'Unknown account', owner: accIdx.byId[k] ? accIdx.byId[k].owner : 'joint', v: m[k]})).sort((a,b) => b.v - a.v);
}
function spendTotal(w, mk){ return scopedTx(w).filter(t => t.date && t.date.slice(0,7) === mk && t.amount < 0).reduce((s,t) => s + Math.abs(t.amount), 0); }
// A category's budget for a given month: its per-month override if one exists, else its default budget.
function budgetForCategory(c, monthKey){
  if (c.overrides && c.overrides[monthKey] !== undefined && c.overrides[monthKey] !== null) return c.overrides[monthKey];
  return c.budget || 0;
}
function hasOverrideFor(c, mk){ return !!(c.overrides && c.overrides[mk] !== undefined && c.overrides[mk] !== null); }

  const byAcc = spendByAccount(w, mk), accMax = Math.max(1, ...byAcc.map(x => x.v)), prevK = (() => { const [y,m] = mk.split('-').map(Number); const d = new Date(y, m-2, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
  const now = spendTotal(w, mk), before = spendTotal(w, prevK), diff = now - before;

    <section class="k-card" style="gap:var(--space-2)"><h2 class="h-card">Compared with last month</h2>${before ? `<div class="figure-md tnum">${diff<=0?'':'+'}${money(diff,{sign:false}).replace('−','−')}</div><p class="muted">${money(now)} so far this month, against ${money(before)} in ${escapeHtml(monthName(prevK).split(' ')[0])}. ${diff<=0?'Lower, so far.':'Higher, so far.'}</p>` : `<p class="muted">Shows once there are two months of statements.</p>`}</section></div>`;
  let isDetail = false;
  if (sc === 'category'){

    isDetail = true;
    const budget = budgetForCategory(c, mk), actual = actualForCategory(c.name, w), inB = catScopeOk(c, w);
    const txs = scopedTx(w).filter(t => t.date && t.date.slice(0,7) === mk && normCat(t.category) === normCat(c.name)).sort((a,b)=>b.date.localeCompare(a.date));
    detail = `<div class="pane-detail stack">
      <h2 class="card-h hide-phone">${escapeHtml(c.name)}</h2>
      <div class="k-card k-card--hero"><div class="row between"><span class="k-label">Spent</span>${inB ? leftBit(actual,budget) : ''}</div><div class="figure-lg tnum">${money(actual)}</div>${inB ? meterHtml(actual,budget,true) : ''}
        <div class="row between"><span class="muted tnum">${inB ? 'Budget ' + money(budget) + (hasOverrideFor(c,mk)?' (this month only)':'') : 'Not in this budget'}</span><button class="k-btn k-btn--sm" data-open-sheet="category" data-id="${c.id}">Edit budget</button></div></div>
      ${txs.length ? `<div class="k-list">${txs.map(t => `<button class="k-item" data-txn="${t.id}"><div class="k-item__text"><span class="k-item__title">${displayDesc(t.description)}</span><span class="k-item__meta">${escapeHtml(longDate(t.date))} · ${escapeHtml(acctName(t))}</span></div><span class="k-amount${t.amount>0?' k-amount--in':''} tnum">${money(t.amount,{sign:true})}</span></button>`).join('')}</div>`
        : `<div class="k-empty"><b>Nothing in ${escapeHtml(c.name)} yet</b>Transactions you put in this category show here.</div>`}
    </div>`;
  }
  root.innerHTML = whoEmptyHtml(w) + `<div class="panes${isDetail?' is-detail':''}">${listPane}${detail}</div>`;
}

/* ---------------------- DUPLICATE DETECTION ---------------------- */
// Two transactions are a "suspected duplicate" if they share the same date,
// the same amount (to the penny), and their descriptions are a close match
// (either one contains the other, once case/punctuation is stripped).
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normDesc(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function looksLikeDuplicate(a, b){
  if (a.date !== b.date) return false;
  if (Math.abs(a.amount) !== Math.abs(b.amount)) return false;
  const da = normDesc(a.description), db = normDesc(b.description);
  if (!da || !db) return false;
  return da === db || da.includes(db) || db.includes(da);
}
// Finds saved-transaction ids that look like duplicates of each other, restricted to `pool`.
// Returns a Set of ids that are involved in at least one duplicate pair.
function findDuplicateIdsIn(pool){
  const flagged = new Set();
  const active = pool.filter(t => !t.dupIgnored);
  for (let i=0; i<active.length; i++){
    for (let j=i+1; j<active.length; j++){
      if (looksLikeDuplicate(active[i], active[j])){
        flagged.add(active[i].id); flagged.add(active[j].id);
      }
    }
  }
  return flagged;
}
// For the upload preview: flags NEW rows that match something already saved in Firestore
// (any month, not just the one being viewed) — catches re-uploading an overlapping statement.
function findRowsMatchingExisting(newRows){
  const matches = new Array(newRows.length).fill(false);
  newRows.forEach((row, i) => {
    if (transactions.some(existing => looksLikeDuplicate(row, existing))) matches[i] = true;
  });
  return matches;
}

/* ---------------------- TRANSACTIONS ---------------------- */
const TXN_FILTERS = [['all','All'],['uncategorised','Needs a category'],['in','Money in'],['transfers','Transfers'],['hide-transfers','Hide transfers'],['duplicates','Possible duplicates']];
let txnTyping = null;
function txnUrl(mk, filter, q, acct){
  const p = new URLSearchParams(); if (filter && filter !== 'all') p.set('filter', filter); if (q) p.set('q', q); if (acct === undefined) acct = routeNow.account; if (acct) p.set('account', acct);
  const s = p.toString(); return '/transactions/' + mk + (s ? '?' + s : '');
}
function applyTxnFilter(rows, f, dupIds){
  if (f === 'uncategorised') return rows.filter(isUncat);
  if (f === 'duplicates') return rows.filter(t => dupIds.has(t.id));
  if (f === 'in') return rows.filter(t => t.amount > 0 && !isTransfer(t));
  if (f === 'transfers') return rows.filter(isTransfer);
  if (f === 'hide-transfers') return rows.filter(t => !isTransfer(t));
  return rows;
}
function renderTransactions(){
  const root = document.getElementById('txn-root'); if (!root) return;
  if (!dataReady.transactions){ root.innerHTML = skeleton(); return; }
  const mk = selectedMonth;
  const qv = txnTyping !== null ? txnTyping : (routeNow.q || '');
  const q = (routeNow.q || '').trim().toLowerCase();
  let filter = TXN_FILTERS.some(f => f[0] === routeNow.filter) ? routeNow.filter : 'all';
  const w = curWho('transactions'), inScope = t => txInWho(t, w) && (!routeNow.account || (acctOf(t) && acctOf(t).id === routeNow.account));
  const monthRows = transactions.filter(t => inScope(t) && t.date && t.date.slice(0,7) === mk);
  const dupIds = findDuplicateIdsIn(monthRows);
  if (filter === 'duplicates' && !dupIds.size && !q) filter = 'all';
  let rows;
  if (q){
    rows = transactions.filter(t => {
      if (!inScope(t)) return false;
      const desc = (t.description||'').toLowerCase(), amtStr = Math.abs(t.amount).toFixed(2), cat = (t.category||'Uncategorised').toLowerCase();
      return desc.includes(q) || amtStr.includes(q) || cat.includes(q);
    });
  } else rows = monthRows;
  rows = applyTxnFilter(rows, filter, findDuplicateIdsIn(transactions)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const dupAll = q ? findDuplicateIdsIn(transactions) : dupIds;

  const chips = TXN_FILTERS.filter(f => f[0] !== 'duplicates' || dupIds.size).map(f => `<a class="k-chip" href="${txnUrl(mk, f[0], routeNow.q)}" aria-pressed="${f[0]===filter}" data-chip>${f[1]}</a>`).join('');
  const meta = t => {
    const bits = [];
    if (!isTransfer(t)) bits.push(isUncat(t) ? '<span class="k-tag k-tag--warn">Needs a category</span>' : escapeHtml(t.category));
    if (dupAll.has(t.id)) bits.push('<span class="k-tag k-tag--warn">Possible duplicate</span>');
    if (isTransfer(t)) bits.push(`<span class="k-tag">${icon('transfer',14)} Transfer</span>`); bits.push(escapeHtml(acctName(t)));
    return bits.map((b,i)=>i ? ' · ' + b : b).join('');
  };
  const amt = t => isTransfer(t) ? `<span class="k-amount tnum" style="color:var(--ink-2)">${money(t.amount)}</span>` : `<span class="k-amount${t.amount>0?' k-amount--in':''} tnum">${money(t.amount,{sign:true})}</span>`;
  let phone = '', desk = '';
  if (rows.length){
    const days = []; rows.forEach(t => { const last = days[days.length-1]; if (last && last.d === t.date) last.rows.push(t); else days.push({d:t.date, rows:[t]}); });
    phone = days.map(g => `<span class="k-label k-label--day">${escapeHtml(dayLabel(g.d))}</span><div class="k-list">${g.rows.map(t => `<button class="k-item" data-txn="${t.id}"><div class="k-item__text"><span class="k-item__title">${displayDesc(t.description)}</span><span class="k-item__meta">${meta(t)}</span></div>${amt(t)}</button>`).join('')}</div>`).join('');
    desk = `<div class="k-card" style="padding:var(--space-2) var(--space-4)"><div class="k-trow k-trow--head"><span class="k-label">Date</span><span class="k-label">Description</span><span class="k-label">Category</span><span class="k-label">Account</span><span class="k-label">Amount</span></div>${rows.map(t => `<div class="k-trow" tabindex="0" role="button" data-txn="${t.id}"><span class="tnum muted">${escapeHtml(shortDate(t.date))}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${displayDesc(t.description)}${dupAll.has(t.id)?' <span class="k-tag k-tag--warn">Possible duplicate</span>':''}</span><span>${isTransfer(t)?`<span class="k-tag">${icon('transfer',14)} Transfer</span>`:isUncat(t)?'<span class="k-tag k-tag--warn">Needs a category</span>':escapeHtml(t.category)}</span><span class="acct-cell">${whoBadge(ownerOfTx(t))}${escapeHtml(acctName(t))}</span>${amt(t)}</div>`).join('')}</div>`;
  }
  const empty = q ? `<div class="k-empty"><b>Nothing matches “${escapeHtml(routeNow.q)}”</b>Search looks through every month.</div>`
    : `<div class="k-empty"><b>No transactions here</b>${filter==='all'?'Add a statement to fill this month.<div style="margin-top:12px"><a class="k-btn" href="/inbox">Open Inbox</a></div>':'Nothing in this filter for this month.'}</div>`;
  root.innerHTML = whoEmptyHtml(curWho('transactions')) + `<div class="stack">
    <div class="row" style="gap:var(--space-3);flex-wrap:wrap"><form class="k-field" id="txn-search-form" role="search" style="flex:1;min-width:220px;margin:0"><label class="sr-only" for="txn-q">Search</label><div class="k-field__box">${icon('search')}<input id="txn-q" type="search" placeholder="Search all accounts and months" value="${escapeHtml(qv)}" autocomplete="off"></div></form>
      <label class="k-field" style="margin:0;min-width:200px"><span class="sr-only">Account</span><div class="k-field__box"><select id="txn-acct" aria-label="Account"><option value="">All accounts</option>${liveAccounts().filter(a => w === 'all' || a.owner === w || w === 'joint').map(a => `<option value="${escapeHtml(a.id)}"${a.id===routeNow.account?' selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select></div></label></div>
    ${q ? `<div class="row between"><span class="muted">${rows.length} result${rows.length===1?'':'s'} across all months</span><a class="k-link" href="${txnUrl(mk, filter, '')}">Clear</a></div>` : monthSwitcher(mk)}
    <div class="k-chips">${chips}</div>
    ${rows.length ? `<div class="hide-desk">${phone}</div><div class="hide-phone">${desk}</div>` : empty}
  </div>`;
}

document.addEventListener('change', e => { if (e.target.id === 'txn-acct') go(txnUrl(selectedMonth, routeNow.filter, routeNow.q, e.target.value)); });

/* ---------------------- SHEETS: txn, category, newcat ---------------------- */
function sheetShell(title, body, actions){
  return `<div class="k-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="k-sheet__grabber"></div>
    <div class="k-sheet__head"><h2 id="sheet-title" data-sheet-title tabindex="-1" style="outline:none">${title}</h2><button class="k-btn k-btn--ghost k-btn--sm" data-sheet-close type="button">Close</button></div>
    ${body}${actions ? `<div class="sheet-actions">${actions}</div>` : ''}</div>`;
}
document.getElementById('sheet-host').addEventListener('click', e => { if (e.target.closest('[data-sheet-close]')) closeSheet(); });
function dropSheetFromUrl(){
  const u = new URL(location.href); u.searchParams.delete('sheet'); u.searchParams.delete('id');
  history.replaceState(history.state, '', u.pathname + u.search); routeNow.sheet = null; routeNow.sheetId = null;
}
function firstKeyword(desc){
  const kw = (desc||'').toLowerCase().split(' ')[0];
  return (kw && kw.length >= 3 && /^[a-z0-9]+$/.test(kw)) ? kw : null;   // same rule as the import
}

SHEETS.txn = (host, id) => {
  const t = transactions.find(x => x.id === id);
  if (!t){ host.style.display = 'none'; host.innerHTML = ''; if (dataReady.transactions) dropSheetFromUrl(); return; }
  const ref = usersCol().collection('transactions').doc(id);
  let cat = isUncat(t) ? '' : t.category, always = false;
  const kw = firstKeyword(t.description);
  const guess = isUncat(t) ? guessCategory(t.description) : 'Uncategorised';
  const suggest = guess && guess !== 'Uncategorised' ? guess : '';
  const dupOther = !t.dupIgnored ? transactions.find(o => o.id !== t.id && !o.dupIgnored && looksLikeDuplicate(t, o)) : null;
  const chipHtml = () => (suggest && !cat ? `<button class="k-chip k-chip--smart" type="button" data-cat="${escapeHtml(suggest)}" aria-pressed="false">${icon('smart',16)}Suggested: ${escapeHtml(suggest)}</button>` : '')
    + categories.map(c => `<button class="k-chip" type="button" data-cat="${escapeHtml(c.name)}" aria-pressed="${normCat(c.name)===normCat(cat)}">${escapeHtml(c.name)}</button>`).join('');
  host.innerHTML = sheetShell(displayDesc(t.description), `
    <div class="figure-lg tnum${t.amount>0?' k-amount--in':''}" style="text-align:left">${money(t.amount,{sign:true})}</div>
    <dl class="k-dl"><dt>Date</dt><dd>${escapeHtml(longDate(t.date))}</dd><dt>Account</dt><dd>${escapeHtml(t.account||'Not set')}</dd></dl>
    ${dupOther ? `<div class="k-banner k-banner--warn">${icon('warning')}<span style="flex:1">Looks like a duplicate of ${displayDesc(dupOther.description)} on ${escapeHtml(shortDate(dupOther.date))}</span><button class="k-btn k-btn--sm" type="button" id="txn-notdup">Not a duplicate</button></div>` : ''}
    <div class="stack"><span class="k-label">Category</span><div class="chip-wrap" id="txn-cats">${chipHtml()}</div></div>
    <div id="txn-always-wrap">${kw ? `<label class="k-toggle"><span class="k-toggle__text"><span>Always put “${escapeHtml(titleCase(kw))}” here</span><span class="hint">Future statements will use this category</span></span><span class="k-switch"><input type="checkbox" id="txn-always"><span></span></span></label>` : ''}</div>
    <div><button class="k-link" type="button" id="txn-edit-toggle" style="background:none;border:0;padding:0;cursor:pointer;min-height:var(--tap)">Edit details</button>
      <div class="stack" id="txn-edit" style="display:none">
        <div class="k-field"><label for="te-date">Date</label><div class="k-field__box"><input id="te-date" type="date" value="${escapeHtml(t.date)}"></div></div>
        <div class="k-field"><label for="te-desc">Description</label><div class="k-field__box"><input id="te-desc" type="text" value="${escapeHtml(t.description)}"></div></div>
        <div class="k-field"><label for="te-amt">Amount (negative is money out)</label><div class="k-field__box"><input id="te-amt" type="number" step="0.01" value="${t.amount.toFixed(2)}"></div></div>
      </div></div>`,
    `<button class="k-btn k-btn--ghost k-btn--danger" type="button" id="txn-delete">Delete</button><button class="k-btn k-btn--primary" type="button" data-sheet-close>Done</button>`);
  const cats = host.querySelector('#txn-cats');
  cats.addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    cat = b.dataset.cat; cats.innerHTML = chipHtml();
    ref.update({ category: cat }).catch(saveFail);
  });
  host.querySelector('#txn-always') && host.querySelector('#txn-always').addEventListener('change', e => { always = e.target.checked; });
  host.querySelector('#txn-edit-toggle').onclick = () => { const el = host.querySelector('#txn-edit'); el.style.display = el.style.display === 'none' ? 'flex' : 'none'; };
  host.querySelector('#te-date').onchange = e => { if (e.target.value) ref.update({ date: e.target.value }).catch(saveFail); };

/* ---------------------- STATEMENT COVERAGE + MONTHLY REMINDER ---------------------- */
const HOUSEHOLD_ACCOUNTS = ['Lloyds credit card', 'Joint Bank of Scotland'];
function statementCoverage(){
  const now = new Date(); const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevKey = prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0');
  return HOUSEHOLD_ACCOUNTS.map(acc => {
    const months = new Set(transactions.filter(t=>t.account===acc && t.date).map(t=>t.date.slice(0,7)));
    if (!months.size) return {acc, none:true, missing:[prevKey], prevKey};
    const sorted = [...months].sort(); const missing = [];
    let [y,m] = sorted[0].split('-').map(Number);
    while ((y+'-'+String(m).padStart(2,'0')) <= prevKey){
      const k = y+'-'+String(m).padStart(2,'0'); if (!months.has(k)) missing.push(k);
      m++; if (m>12){m=1;y++;}
    }
    return {acc, none:false, missing, last: sorted[sorted.length-1], prevKey};
  });
}

const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function isoDateOf(v){

  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m){ let y = m[3]; if (y.length === 2) y = '20' + y; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }

function colFind(headers, hints, not){ return headers.find(h => { const l = h.toLowerCase().trim(); return hints.some(x => l === x || l.includes(x)) && !(not||[]).some(x => l.includes(x)); }) || ''; }
/* read a CSV into rows, whatever the bank calls its columns (Bank of Scotland/Lloyds, Monzo, Nationwide, Amex, others) */
function parseBankCsv(text){
  const res = Papa.parse(text.replace(/^﻿/, ''), {header:true, skipEmptyLines:true});
  const headers = res.meta.fields || [], data = res.data;
  const dCol = colFind(headers, ['transaction date','date','posted']);
  const descCol = colFind(headers, ['transaction description','description','details','narrative','merchant','name','reference'], ['sort','account number']);
  const aCol = colFind(headers, ['amount','value'], ['local','currency','debit','credit','paid']);
  const debCol = colFind(headers, ['debit amount','paid out','money out','debit','withdrawal','out']), credCol = colFind(headers, ['credit amount','paid in','money in','credit','deposit']);
  const balCol = colFind(headers, ['balance']);
  const acctCols = headers.filter(h => /account number|card number|card no|account no/i.test(h));
  const cand = new Set();
  const rows = []; const balances = [];
  data.forEach((r, i) => {
    const date = isoDateOf(r[dCol]); const desc = String(r[descCol] || '').replace(/\s+/g,' ').trim(); if (!date || !desc) return;
    let amt = NaN;
    if (aCol && r[aCol] !== undefined && String(r[aCol]).trim() !== '') amt = parseAmount(r[aCol]);
    if (isNaN(amt) && (debCol || credCol)){ const d = parseAmount(r[debCol]), c = parseAmount(r[credCol]); if (!isNaN(d) || !isNaN(c)) amt = (isNaN(c) ? 0 : Math.abs(c)) - (isNaN(d) ? 0 : Math.abs(d)); }
    if (isNaN(amt)) return;
    rows.push({date, description: desc, amount: Math.round(amt * 100) / 100});
    if (balCol){ const b = parseAmount(r[balCol]); if (!isNaN(b)) balances.push({i: rows.length-1, date, b}); }
    acctCols.forEach(c => { const dg = String(r[c]||'').replace(/\D/g,''); if (dg.length >= 4) cand.add(dg.slice(-4)); });
  });
  const raw = text.slice(0, 4000);
  for (const m of raw.matchAll(/(?:\*{2,}|x{2,}|X{2,}|·{2,}|•{2,}|ending(?: in)?|last (?:4|four) digits)[\s:]*(\d{4})\b/g)) cand.add(m[1]);
  let closing = null;
  if (balances.length){ const asc = rows.length < 2 || rows[0].date <= rows[rows.length-1].date; const maxd = balances.reduce((a,b) => b.date > a ? b.date : a, ''); const last = balances.filter(b => b.date === maxd); closing = (asc ? last[last.length-1] : last[0]).b; }
  const singleAmount = !!aCol && !(debCol && credCol);
  return {rows, candidates: [...cand], closing, singleAmount, headers, usable: rows.length > 0, missingCols: !dCol || !descCol || (!aCol && !(debCol || credCol))};
}
async function readPdfRows(file, buf){

  const pdf = await pdfjsLib.getDocument({data: buf.slice(0)}).promise; let lines = [];
  for (let p = 1; p <= pdf.numPages; p++){ const page = await pdf.getPage(p); const content = await page.getTextContent(); lines = lines.concat(groupTextIntoLines(content.items)); }
  const cand = new Set(); lines.join('\n').slice(0, 6000).replace(/(?:\*{2,}|x{2,}|X{2,}|·{2,}|•{2,}|ending(?: in)?|account number|card number)[\s:]*[\d\s*xX·•-]*?(\d{4})\b/gi, (m, d) => { cand.add(d); return m; });

function findAccountFor(file, parsed){
  const pool = liveAccounts();

  const nm = file.name.toLowerCase();

function rowKey(accId, r){ return accId + '|' + r.date + '|' + (Math.round(r.amount*100)/100).toFixed(2) + '|' + normDesc(r.description); }

  const m = {}; transactions.forEach(t => { if (acctOf(t) !== acc || !t.date) return; const k = rowKey(acc.id, {date:t.date, amount:t.amount, description:t.description}); m[k] = (m[k]||0) + 1; });

    const k = rowKey(acc.id, r); seen[k] = (seen[k]||0) + 1;

/* save: transactions + statement record + balance + transfer matching. One batch, so a file is all-in or all-out. */
async function commitStatement(acc, prepared, meta){

  const stRef = stCol.doc(), now = new Date().toISOString();
  const refs = prepared.rows.map(() => col.doc());
  const newRows = prepared.rows.map((r, i) => Object.assign({id: refs[i].id}, r, {accountId: acc.id}));
  // transfers: this account's patterns, or an equal and opposite amount in another account within 3 days
  const others = transactions.filter(t => !isTransfer(t) && t.date && acctOf(t) && acctOf(t) !== acc);
  const pairedExisting = {}; let matched = 0;
  newRows.forEach(r => {
    const pat = looksTransfer(r.description, [acc]);
    const cand = others.find(t => !pairedExisting[t.id] && Math.abs(t.amount + r.amount) < 0.005 && Math.abs(dayNum(t.date) - dayNum(r.date)) <= 3 && (pat || looksTransfer(t.description, [acctOf(t)])));

    else if (pat === 'pattern'){ r.kind = 'transfer'; }
  });

  newRows.forEach((r, i) => { const {id, ...d} = r; batch.set(refs[i], Object.assign(d, {account: acc.name, statementId: stRef.id, importedAt: now})); });
  Object.keys(pairedExisting).forEach(id => batch.update(col.doc(id), {kind:'transfer', transferPairId: pairedExisting[id]}));

  else if (typeof acc.balance === 'number' && prepared.rows.length && newer){ const sum = prepared.rows.reduce((s, r) => s + r.amount, 0); upd.balance = Math.round((acc.balance + sum) * 100) / 100; upd.balanceDate = lastDate; upd.balanceSource = 'worked-out'; }

async function undoStatement(stId){

async function ingestFiles(files, source){
  if (!uid){ return; }
  if (virtualAccounts()){ toast('Download a backup first, then add files.'); return; }
  inboxBusy = true; renderInbox();
  for (const file of files){
    try {
      const lower = file.name.toLowerCase(), isPdf = file.type === 'application/pdf' || lower.endsWith('.pdf'), isCsv = lower.endsWith('.csv') || file.type === 'text/csv' || lower.endsWith('.txt');
      if (!isPdf && !isCsv){ pushInbox({fileName:file.name, status:'other', note:'Not a bank statement, so left alone.'}); continue; }
      const buf = await file.arrayBuffer(), hash = await fileHashOf(buf);
      const dupSt = statements.find(s => s.fileHash === hash);
      if (dupSt){ const a = accounts.find(x => x.id === dupSt.accountId); pushInbox({fileName:file.name, status:'skip', accountId: dupSt.accountId, note: INBOX_NOTE.skip}); continue; }
      const parsed = isPdf ? await readPdfRows(file, buf) : parseBankCsv(new TextDecoder('utf-8').decode(buf));
      if (!parsed.usable){ pushInbox({fileName:file.name, status:'other', note: isPdf ? "Couldn't read lines from this PDF. Try the CSV from your bank instead." : "No dates and amounts found, so it was left alone."}); continue; }
      const acc = findAccountFor(file, parsed);
      if (!acc){ pushInbox({fileName:file.name, status:'need', note: "Couldn't tell which account. There's no card or account number inside.", parsed, hash, source, buf: null, candidates: parsed.candidates}); continue; }
      await finishFile({fileName:file.name, hash, source}, acc, parsed);
    } catch(err){ console.error(err); pushInbox({fileName:file.name, status:'other', note:'Could not read this file (' + (err.message||'error') + ').'}); }
  }
  inboxBusy = false; renderInbox();
}
async function finishFile(meta, acc, parsed, remember){
  const flip = acc.type === 'credit' && parsed.singleAmount && parsed.rows.length && parsed.rows.filter(r => r.amount > 0).length / parsed.rows.length > 0.7;
  const prepared = prepareRows(acc, parsed.rows, {flipSign: flip});
  if (!prepared.rows.length){ pushInbox({fileName:meta.fileName, status:'skip', accountId:acc.id, note:'Already in. Nothing added twice.'}); await recordSeenOnly(acc, meta, parsed); return null; }
  const res = await commitStatement(acc, prepared, {fileName:meta.fileName, fileHash:meta.hash, source:meta.source, closing: flip ? parsed.closing : parsed.closing, remember});
  const lastDate = prepared.rows.map(r => r.date).sort().pop();
  pushInbox({fileName:meta.fileName, status:'in', accountId:acc.id, statementId:res.statementId, added:res.added, transfers:res.transfers, skipped:res.skipped,
    note: `${res.added} transaction${res.added===1?'':'s'}${lastDate ? ' to ' + shortDate(lastDate) : ''}${res.balance != null ? (acc.type==='credit' ? ' · owed ' : ' · balance ') + money(Math.abs(res.balance)) : ''}${res.skipped ? ' · ' + res.skipped + ' already in' : ''}`});
  lastRun = {at: new Date().toISOString()}; return res;
}
async function recordSeenOnly(acc, meta, parsed){ // all lines were already in: remember the file so it is not read again
  try { await usersCol().collection('statements').add({accountId: acc.id, month: (parsed.rows.map(r=>r.date).sort().pop()||'').slice(0,7), fileName: meta.fileName, fileHash: meta.hash, source: meta.source||'drop', importedAt: new Date().toISOString(), rows: 0, skippedRows: parsed.rows.length}); } catch(e){}
}

async function resolveNeed(itemId){
  const it = inboxItems.find(i => i.id === itemId); if (!it) return;
  const sel = document.querySelector(`[data-need-acct="${itemId}"]`), acc = accounts.find(a => a.id === (sel && sel.value)); if (!acc){ if (sel) sel.focus(); return; }
  const rem = document.querySelector(`[data-need-rem="${itemId}"]`);
  const remember = rem && rem.checked ? {pattern: patternFromName(it.fileName), last4: (it.candidates||[])[0] || ''} : null;
  inboxItems = inboxItems.filter(i => i.id !== itemId);
  await finishFile({fileName: it.fileName, hash: it.hash, source: it.source}, acc, it.parsed, remember);
  renderShell(); renderInbox();
}

function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('kodu-finance', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const d = await idbOpen(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbSet(k, v){ try { const d = await idbOpen(); await new Promise((res, rej) => { const t = d.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = rej; }); } catch(e){} }

async function loadFolder(){
  if (!FS_OK) return; folderHandle = await idbGet('folder');
  if (!folderHandle){ folderState = 'none'; return; }
  try { const p = await folderHandle.queryPermission({mode:'read'}); folderState = p === 'granted' ? 'ready' : 'needs-permission'; } catch(e){ folderState = 'needs-permission'; }

async function chooseFolder(){

async function allowFolder(){ try { const p = await folderHandle.requestPermission({mode:'read'}); folderState = p === 'granted' ? 'ready' : 'needs-permission'; if (folderState === 'ready') await scanFolder(); } catch(e){} renderInbox(); }
async function scanFolder(){
  if (!FS_OK || !folderHandle || folderState !== 'ready' || !uid) return;
  const seen = (await idbGet('seen')) || {}, fresh = [];
  try { for await (const [name, h] of folderHandle.entries()){
    if (h.kind !== 'file' || !/\.(csv|pdf)$/i.test(name)) continue;
    const f = await h.getFile(), key = name + '|' + f.size + '|' + f.lastModified; if (seen[key]) continue; seen[key] = 1; fresh.push(f);
  } } catch(e){ folderState = 'needs-permission'; renderInbox(); return; }

function parseFile(file){

async function parsePdfFile(file){
  const warnEl = { style:{}, set innerHTML(v){ setImportWarn(v,true); renderStatements(); }, set textContent(v){ setImportWarn(v); renderStatements(); } };

    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let lines = [];
    for (let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      lines = lines.concat(groupTextIntoLines(content.items));

        'or export a CSV from your bank\'s website if that\'s available.';
      return;

    mappedRows = parsed;
    if (parsed.some(r => r.uncertainSign)){
      warnEl.style.display = 'block';

// Groups pdf.js text items into visual lines by their y-position, left-to-right.

// Handles two shapes:
//  1) Bank statements with an explicit Type column (DD, DEB, FPO, FPI, SO, etc.)
//     — e.g. Bank of Scotland/Lloyds-style layouts. When detected, ONLY rows
//     typed DD (Direct Debit) or DEB (Debit Card) are kept — transfers (FPO/FPI),
//     interest, and anything else are deliberately excluded, and the amount used
//     is always treated as money OUT (DD/DEB are never money in).

  } else {
    const monthDates = findMonthNameDates(rest);
    if (monthDates.length) {

function extractTransactionsFromLines(lines){

  // typed statement and require every kept row to have one — this is what filters
  // out the interest line, summary lines, and the transaction-types legend.
  const typedLineCount = lines.filter(l => typeRe.test(l)).length;
  const isTypedStatement = typedLineCount >= 3;
  const out = [];

  lines.forEach(line => {
    const monies = line.match(moneyTok);
    if (!monies || !monies.length) return;
    const typeMatch = line.match(typeRe);

    if (isTypedStatement) {
      if (!typeMatch) return; // no Type code on this line — not a transaction row
      const type = typeMatch[1].toUpperCase();
      if (!INCLUDE_TYPES.includes(type)) return; // drop transfers, interest, etc.

      const amountToken = monies.length >= 2 ? monies[monies.length-2] : monies[monies.length-1];
      let amount = parseAmount(amountToken);
      if (isNaN(amount)) return;
      amount = Math.abs(amount); // shown as a positive spend amount by default

      const { date, rest } = extractDateAndStrip(line.slice(0, typeMatch.index));
      if (!date) return;
      const description = rest.replace(/[,\s]+/g, ' ').trim() || 'Transaction';
      out.push({ date, description, amount, uncertainSign: false });
      return;
    }

    // Fallback: no Type column detected — generic heuristic
    const amountToken = monies[monies.length-1];
    const amount = parseAmount(amountToken);
    if (isNaN(amount)) return;
    const { date, rest } = extractDateAndStrip(line.slice(0, line.lastIndexOf(amountToken)));
    if (!date) return;
    const description = rest.replace(/^[\s,]*\d{2,6}[\s,]+/, '').replace(/[,\s]+/g, ' ').trim() || 'Transaction';
    out.push({ date, description, amount, uncertainSign: !/^-|^\(/.test(amountToken.trim()) });

let businessForecast = null, incomeError = '';
const BF_KEY = 'kodu-business-forecast';
const BF_INCLUDE_KEY = 'kodu-include-business';
function countAgreed(){ return true; } // the list always shows invoices, agreed jobs and the total (Alexi, 21 Nov)
function hasAgreed(){ return !!(businessForecast && businessForecast.months.some(m => typeof m.agreed_jobs === 'number')); }
try { businessForecast = JSON.parse(localStorage.getItem(BF_KEY) || 'null'); } catch(e){ businessForecast = null; }
function validateBusinessForecast(d){
  if (!d || typeof d !== 'object') return 'That file isn\'t a forecast.';
  if (d.version !== 1 && d.version !== 2) return 'This forecast is a newer format than this app understands (version ' + d.version + ').';
  if (d.version === 2){
    const kinds = ['signed','invoiced','received'];
    if (!kinds.some(k => Array.isArray(d[k]))) return 'The forecast has no signed, invoiced or received months in it.';
    for (const k of kinds){ if (d[k] == null) continue; if (!Array.isArray(d[k])) return k + ' should be a list of months.';
      for (const m of d[k]){ if (!/^\d{4}-\d{2}$/.test(m.month||'')) return k + ': a month is missing its date (expected like 2026-11).'; if (typeof m.take_home !== 'number' || !isFinite(m.take_home)) return k + ' ' + m.month + ': take_home should be a number.'; } }
    if (!Array.isArray(d.months)) d.months = [];
  }
  if (!Array.isArray(d.months) || (d.version === 1 && !d.months.length)) return 'The forecast has no months in it.';
  for (const m of d.months){
    if (!/^\d{4}-\d{2}$/.test(m.month||'')) return 'A month is missing its date (expected like 2026-11).';
    if (typeof m.take_home !== 'number' || !isFinite(m.take_home)) return m.month + ': take_home should be a number.';
    if (m.earned != null && (typeof m.earned !== 'number' || !isFinite(m.earned))) return m.month + ': earned should be a number.';
    if (m.agreed_jobs != null && (typeof m.agreed_jobs !== 'number' || !isFinite(m.agreed_jobs))) return m.month + ': agreed_jobs should be a number.';
  }

}
function gbp(n){ return '£' + Math.round(n).toLocaleString('en-GB'); }
const BASIS_LABEL = {signed:'Signed work', invoiced:'Invoices sent', avg3:'3-month average', avg6:'6-month average', avg12:'12-month average', off:'Left out'};
function incomeBasis(){
  const b = settingsDoc && settingsDoc.incomeBasis; if (BASIS_LABEL[b]) return b;
  try { return localStorage.getItem(BF_INCLUDE_KEY) === '1' ? 'avg6' : 'off'; } catch(e){ return 'off'; }  // first run: the old per-browser box maps across
}
function bfSeries(kind){
  const f = businessForecast; if (!f || !Array.isArray(f[kind])) return null; const m = {};
  f[kind].forEach(x => { if (x && /^\d{4}-\d{2}$/.test(x.month) && isFinite(x.take_home)) m[x.month] = (m[x.month]||0) + x.take_home; }); return m;
}
function receivedHistory(){ // what reached you in past months, newest first (v2 'received', else v1 months before this month)

  if (!m && businessForecast && Array.isArray(businessForecast.months)){ m = {}; businessForecast.months.forEach(x => { if (x.month < cur && typeof x.take_home === 'number') m[x.month] = x.take_home; }); }

function includeBusiness(){ return incomeBasis() !== 'off'; }

document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#btn-signout')){ auth().signOut(); } if (e.target.closest && e.target.closest('#btn-backup, #btn-backup-first, [data-backup]')) downloadBackup(); });
document.addEventListener('change', e => {
  if (e.target.id !== 'set-me' && e.target.id !== 'set-partner') return;
  const me = document.getElementById('set-me').value.trim(), pa = document.getElementById('set-partner').value.trim();
  usersCol().collection('settings').doc('profile').set({people: {me, partner: pa}}, {merge:true}).then(() => toast('Names saved')).catch(saveFail);
});
async function downloadBackup(){
  const btn = document.getElementById('btn-backup'); if (btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try {
    const out = {app:'Kodu Finance', version: APP_VERSION, exportedAt: new Date().toISOString(), collections:{}};
    for (const name of ['categories','transactions','bills','plannedExpenses','accounts','statements']){
      const snap = await usersCol().collection(name).get(); out.collections[name] = snap.docs.map(d => ({id:d.id, data:d.data()}));
    }
    const st = await usersCol().collection('settings').get(); out.collections.settings = st.docs.map(d => ({id:d.id, data:d.data()}));
    const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'kodu-finance-backup-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    try { localStorage.setItem('kodu-backup-ok','1'); } catch(e){} toast('Backup downloaded');
    if (virtualAccounts()){ seedAccountsOnce.done = false; accounts = []; usersCol().collection('accounts').get().then(seedAccountsOnce).catch(()=>{}); }
  } catch(e){ toast("Couldn't make the backup. Try again."); }
  if (btn){ btn.disabled = false; btn.textContent = 'Download a backup'; }
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'notif-switch') return;
  if (e.target.checked){ try { await Notification.requestPermission(); } catch(err){} }
  else toast('To turn reminders off, change it in your browser\'s site settings.');
  renderSettings();
});

route();
</script>
