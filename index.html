<style>
  /* Tokens V1 (1.0.0-rc2) comes from kodu/. blue is ink now; --accent is for smart things only. */
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-sans); font-size:16px; line-height:1.45;}
  h1,h2,h3{margin:0; font-weight:600;}
  input,select,button,textarea{font-family:inherit;}

  button{cursor:pointer;}

  /* ---------- layout ---------- */
  #app{display:none; min-height:100vh;}
  #app.ready{display:block;}
  .appver{font-weight:400; font-size:var(--type-caption-size); color:var(--ink-2);}
  .more-list{display:flex; flex-direction:column;}
  .more-link{background:none; border:none; border-bottom:1px solid var(--line); text-align:left; padding:14px 4px; font-size:var(--type-body-size); color:var(--ink);}
  .k-tabbar{display:flex;}

  .k-tab[aria-current="page"]::before{left:20%; right:20%;}
  .k-side-link{cursor:pointer;}
  a.k-avatar, a.k-side-link, a.k-tab, #top-avatar{text-decoration:none !important;}
  .k-mark__tile{background:var(--app-finance-tile, var(--app-finance));}
  @media (min-width:900px){ .k-main > main{max-width:1120px; margin:0; padding:var(--space-5) var(--space-8);} .phone-only{display:none !important;} }
  header .signout{background:none; border:none; color:var(--ink-2); font-size:12px; text-decoration:underline; margin-left:10px;}

  main{flex:1; padding:18px; max-width:720px; margin:0 auto; width:100%;}
  .view{display:none;}
  .view.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; margin-bottom:14px;}
  .card h2{font-size:14px; margin-bottom:12px;}
  .muted{color:var(--ink-2); font-size:14px; line-height:1.5;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .spacer{flex:1;}
  .dash-top{display:flex; flex-direction:column; gap:var(--space-3); margin-bottom:var(--space-3);}
  .dash-top>.k-card{margin-bottom:0;}
  .dash-top>.card{flex:1;}
  @media (min-width:760px){
    .dash-top{flex-direction:row; align-items:stretch;}
  }

  .btn{
    background:var(--ink); color:var(--bg); border:none; border-radius:var(--radius-md); padding:9px 14px;
    font-size:13px; font-weight:600;
  }
  .btn.secondary{background:var(--surface); color:var(--ink); border:1px solid var(--control-border);}
  .btn.danger{background:var(--negative);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea{
    border:1px solid var(--control-border); border-radius:var(--radius-md); padding:8px 10px; width:100%; font-size:16px; background:var(--surface); color:var(--ink);
  }
  label{font-size:var(--type-label-size); color:var(--ink-2); display:block; margin-bottom:4px; font-weight:var(--type-label-weight); text-transform:uppercase; letter-spacing:var(--type-label-tracking); font-family:var(--font-mono);}
  .field{margin-bottom:12px;}
  label:has(input[type=checkbox]){font-family:var(--font-sans); text-transform:none; letter-spacing:0; font-size:var(--type-small-size); color:var(--ink); font-weight:400;}

  /* auth */
  #auth-screen{
    display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px;
  }
  #auth-screen .box{width:100%; max-width:340px;}
  #auth-screen h1{font-size:20px; margin-bottom:4px;}
  .auth-mark{display:flex; flex-direction:column; align-items:flex-start; gap:16px; margin-bottom:12px !important;}
  .auth-mark__tile{width:56px; height:56px; border-radius:22%; display:block;}
  #auth-screen .muted{margin-bottom:20px;}
  #auth-error{color:var(--negative); font-size:12px; margin-top:8px; min-height:16px;}
  #config-warning{
    display:none; background:var(--negative-tint); color:var(--negative); border:1px solid var(--negative);
    border-radius:var(--radius-md); padding:12px 14px; font-size:12px; max-width:480px; margin:40px auto; line-height:1.6;
  }

  /* dashboard */
  .ring-wrap{display:flex; align-items:center; gap:16px; margin-bottom:6px;}
  .ring{width:74px; height:74px; border-radius:50%; flex-shrink:0; position:relative;}
  .ring::after{content:""; position:absolute; inset:11px; border-radius:50%; background:var(--surface);}
  .ring .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; z-index:1;}

  /* budgets */
  .bar-row{margin-bottom:14px;}

  .bar-row .top .name{font-weight:600;}

  .bar-track{height:9px; background:var(--fill); border-radius:var(--radius-xs); overflow:hidden;}
  .bar-fill{height:100%; background:var(--ink);}
  .bar-fill.over{background:var(--negative);}

  /* upload */

    margin-bottom:14px; background:var(--surface);

  @media (max-width:899px){

    #view-transactions table:has(#txn-rows), #txn-rows, #preview-rows, #preview-card table{display:block;}
    #txn-rows tr, #preview-rows tr{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:12px 0; border-bottom:1px solid var(--line);}
    #txn-rows td, #preview-rows td{border:none; padding:0;}
    #txn-rows td:nth-child(2), #preview-rows td:nth-child(2){order:-1; flex:1 1 100%;}
    #txn-rows td:nth-child(2) input, #preview-rows td:nth-child(2) input{width:100% !important;}
    #txn-rows td:last-child, #preview-rows td:last-child{margin-left:auto;}
  }
  /* shared-component adapters (no inline styles) */
  .k-card{display:block; margin-bottom:var(--space-3);}
  .k-card h2{font-size:var(--type-body-strong-size); margin-bottom:12px;}
  .btn-xs{min-height:32px; padding:0 8px; font-size:12px;}
  .btn-xs{min-height:28px; padding:4px 7px; font-size:12px;} .btn-del{color:var(--negative); border-color:var(--negative);} .mr-4{margin-right:4px;}
  .pad-sm{padding:6px 10px;} .pad-xs{padding:4px 6px;} .w-amt{width:96px;} .w-date{width:140px;} .w-auto{width:auto;} .w-full{width:100%;}
  .mb-3{margin-bottom:var(--space-3);} .mb-10{margin-bottom:10px;} .mb-6{margin-bottom:6px;} .mb-14{margin-bottom:14px;}
  .mt-2{margin-top:var(--space-2);} .mt-4{margin-top:4px;} .mt-6{margin-top:6px;} .mt-10{margin-top:10px;} .mt-14{margin-top:14px;} .mt-n6{margin-top:-6px;} .ml-2{margin-left:var(--space-2);}
  .gap-14{gap:14px;} .fx1{flex:1;} .mw120{min-width:120px;} .mw140{min-width:140px;} .ox{overflow-x:auto; -webkit-overflow-scrolling:touch;} .aic{align-items:center;} .ta-r{text-align:right;} .c-ink2{color:var(--ink-2);}
  .month-label{text-align:center; font-weight:600; font-size:var(--type-small-size);} .fs-20{font-size:20px; font-weight:600;}
  .link-btn{border:none; background:none; color:var(--ink); cursor:pointer; text-decoration:underline; font-size:12px; margin-left:6px;}
  .banner-neg{background:var(--negative-tint); color:var(--negative); border:1px solid var(--negative); border-radius:var(--radius-md); padding:8px 12px; font-size:var(--type-caption-size);}
  .banner-neg.is-hidden{display:none;} .legend{display:flex; gap:16px; margin-top:6px; font-size:var(--type-caption-size); color:var(--ink-2);}
  .k-field{margin-bottom:var(--space-3);}

  .k-field label{margin-bottom:0;}
  /* tables: same control size as fields, nothing clipped */
  td input, td select{font-size:16px !important; min-height:36px; padding:4px 8px !important;}
  @media (pointer:coarse){ td input, td select, .k-btn--sm{min-height:44px;} }
  td input.txn-amt, td input.row-amt, .w-amt{width:112px !important;} td input[type=date], .w-date{width:152px !important;}
  td input.amt-pos, .amt-pos{color:var(--positive) !important;}
  td input.txn-desc{min-width:180px;} td select{min-width:156px;} td input.txn-amt, td input.row-amt{text-align:right;}
  .btn-icon-del{min-width:36px; padding:0 8px; color:var(--ink-2);} .btn-icon-del:hover,.btn-icon-del:focus-visible{color:var(--negative); border-color:var(--negative);}
  canvas{width:100%; height:210px; display:block;}
  /* ---- redesign: shared screen layout ---- */
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .screen{display:flex; flex-direction:column; gap:var(--space-6); padding-bottom:var(--space-8);}
  .stack{display:flex; flex-direction:column; gap:var(--space-3);}
  .between{justify-content:space-between;}
  .hint{color:var(--ink-3); font-size:13px;}
  .tnum{font-variant-numeric:tabular-nums;}
  .figure-lg{font:600 32px/36px var(--font-sans); font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:var(--space-2);}

  a.k-item[aria-current="page"]{background:var(--fill); width:auto; margin:0 calc(var(--space-4) * -1); border-radius:var(--radius-sm); padding-left:var(--space-4) !important; padding-right:var(--space-4) !important;}
  .k-field__box svg{flex-shrink:0; color:var(--ink-3);}
  .k-month button:disabled{opacity:.45; cursor:default;}
  .grid-2.plan-pair{align-items:stretch}.plan-pair>.k-card{height:100%}.plan-pair>.k-card:last-child{justify-content:space-between}.k-banner{padding:8px var(--space-4); line-height:1.4; gap:var(--space-3);} .k-banner svg{width:18px; height:18px; flex-shrink:0;} .k-banner button.k-link{padding:0 4px; min-height:0; line-height:1.35;} .pace-banner{padding:10px var(--space-4); align-items:flex-start; margin:var(--space-4) 0;} .pace-banner{border:1px solid var(--accent, var(--ink-3))}.goal-bar{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}.goal-bar i{display:block;height:100%;background:var(--ink);border-radius:5px}.plan-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-3);border-top:1px solid var(--line);padding-top:var(--space-3)}.plan-sum>div{display:flex;flex-direction:column;gap:2px;min-width:0}.plan-sum b{font-size:18px;font-weight:600}

  /* Locked Kodu Finance lock-up (one SVG asset per theme: nothing to crop or misalign) */

  .plan-row--compact{grid-template-columns:48px 44px minmax(0,1fr) auto !important; min-height:64px;} @media (max-width:899px){ .plan-row--compact{grid-template-columns:44px minmax(0,1fr) auto !important;} }
  .file-name{overflow-wrap:normal; word-break:normal;}
  .k-chart text{fill:var(--ink-2); font:400 12px/16px var(--font-sans);} .k-chart text.ch-low{fill:var(--ink); font-weight:600; paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round;}
  .k-chart line.ch-month{stroke:var(--line); stroke-width:1;} .k-chart line.ch-todayline{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3;}
  .k-chart line.ch-comfort{stroke:var(--ink-3); stroke-width:1;} .plan-chart + .k-legend, .plan-chart ~ .k-legend{margin-top:8px;}
  button.k-link{border:0; background:none; padding:0 8px; cursor:pointer; font:inherit; text-decoration:underline; color:var(--ink);}
/* v44: chip rows. Desktop wraps (kit); phone scrolls with a faded right edge */
.k-chips{row-gap:var(--space-2);}
@media (max-width:899px){ .k-chips--fade::after{content:"";position:sticky;right:0;flex:0 0 24px;margin-left:-24px;align-self:stretch;background:linear-gradient(to right,transparent,var(--bg));pointer-events:none;} }
/* v44: auto-ticks, meter, chase sheet */
.mn-sv .mn-undo{font-size:14px;font-weight:400;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:inline;white-space:nowrap;}
.mn-meter{display:block;height:4px;border-radius:2px;background:var(--fill);margin:6px 0 4px;max-width:180px;overflow:hidden;} .mn-meter i{display:block;height:100%;background:var(--ink-2);}
.mn-copybox{padding:var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--fill);font-size:14px;line-height:1.5;user-select:all;}
.mn-chase-steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:14px;} .mn-chase-steps li{display:flex;justify-content:space-between;gap:12px;}
.sheet-actions{flex-wrap:wrap;}
.chip-break{display:none;} @media (min-width:900px){ .chip-break{display:block;flex-basis:100%;height:0;} }
.mn-ov__r > b, .mn-ov__r > .tnum, .mn-idea .tnum{white-space:nowrap;flex-shrink:0;margin-left:var(--space-3);}
.sort-ctl--inline{margin-left:auto;} .sort-phone{display:none;} .k-chips{position:relative;}
@media (max-width:899px){ .sort-ctl--inline{display:none !important;} .sort-phone{display:flex;justify-content:flex-end;} }
@media (min-width:900px){ .sort-ctl--inline{display:inline-flex !important;} }
@media (max-width:899px){ .screen .k-chips{margin-left:calc(var(--space-4) * -1);margin-right:calc(var(--space-4) * -1);padding-left:var(--space-4);padding-right:var(--space-4);} .screen{overflow-x:clip;} }

let accounts = [], statements = [], accIdx = {byId:{}, byName:{}};

function peopleNames(){ const p = (settingsDoc && settingsDoc.people) || {}; return {me: (p.me||'').trim() || 'Me', partner: (p.partner||'').trim() || 'Partner'}; }
function initials(){
  const n = peopleNames(); let a = n.me[0].toUpperCase(), b = n.partner[0].toUpperCase();
  if (a === b){ a = n.me.slice(0,2); a = a[0].toUpperCase() + a.slice(1).toLowerCase(); b = n.partner.slice(0,2); b = b[0].toUpperCase() + b.slice(1).toLowerCase(); }

  accIdx = {byId:{}, byName:{}};
  accounts.forEach(a => { accIdx.byId[a.id] = a; if (a.name) accIdx.byName[a.name] = a; });

function acctOf(t){ return (t.accountId && accIdx.byId[t.accountId]) || (t.account && accIdx.byName[t.account]) || null; }
function acctName(t){ const a = acctOf(t); return a ? a.name : (t.account || 'Unknown account'); }
function ownerOfTx(t){ const a = acctOf(t); return a ? a.owner : 'joint'; } // old untagged rows still count as household
function txInWho(t, w){
  if (w === 'all') return true;
  const k = (t.whose || hhOn()) ? whoseOf(t).k : '';
  if (k === 'joint' || k === 'me') return k === w;   // a chosen side, a shop rule or the account decides
  if (w === 'joint' && t.countAs === 'household') return true;
  return ownerOfTx(t) === w;
}
function aliasOut(t){ if (!hhOn() || !(t.amount < 0)) return false; const a = acctOf(t), l = labelOf(t); return !!a && a.owner === 'joint' && l === 'jo'; }   // money out to the partner is a line to sort; money out to Alexi's own names is just a return of a contribution
function isTransfer(t){ if (aliasOut(t)) return false; if (hhOn() && t.kind === 'transfer' && t.amount < 0 && /allowance/i.test(t.description || '') && ownerOfTx(t) === 'me') return false; return t.kind === 'transfer' || t.kind === 'contribution' || (hhOn() && (!!contribOf(t) || isCardPayment(t))); }
function scopedTx(w){ w = w || curWho(); return transactions.filter(t => !isTransfer(t) && txInWho(t, w)); }
function liveAccounts(){ return accounts.filter(a => !a.archived).sort((x,y) => (x.order||0) - (y.order||0)); }
function acctsOf(o){ return liveAccounts().filter(a => a.owner === o); }
const TYPE_NAME = {current:'Current', credit:'Credit card', savings:'Savings'};
function accountBalance(a){ return typeof a.balance === 'number' ? a.balance : null; }
function ownerTotalOf(o){ return liveAccounts().filter(a => o === 'all' || a.owner === o).reduce((s,a) => s + (accountBalance(a) || 0), 0); }
function hasStatement(a, mk){
  if (statements.some(s => s.accountId === a.id && s.month === mk)) return true;
  return transactions.some(t => t.date && t.date.slice(0,7) === mk && acctOf(t) === a && (t.accountId || t.account));
}
function prevMonthKey(){ return monthKeyAtOffset(-1); }
function waitingAccounts(){ // accounts whose last-month file hasn't arrived (only after the 5th, only once there is any data)

  const pk = prevMonthKey();

}
function lastUpdatedText(a){
  const s = statements.filter(x => x.accountId === a.id && x.importedAt).sort((x,y) => String(y.importedAt).localeCompare(String(x.importedAt)))[0];
  const iso = s ? s.importedAt : (a.balanceDate || null); if (!iso) return null;

}

/* Empty states (Build Spec V3 §0): what it does, why it's empty, one button that turns it on */

function startSavings(){ const b = parseFloat(settingsDoc.startBalance) || 0; return b > 0 ? {balance: b, monthly: avgMonthlySpend() > 0 ? derivedMonthlySaving() : 0, comfort: 2000} : null; }

}
function personName(w){ const n = peopleNames(); return w === 'me' ? (n.me || 'you') : n.partner; }
const WHO_BANNER_SCREENS = ['overview','spending','category','transactions','plan','buys'];
function whoViewPicked(){ const q = new URLSearchParams(location.search).get('who'); return WHO_VALUES.includes(q) ? q : whoPick; }
function whoPhrase(w){ return w === 'partner' ? peopleNames().partner + "'s money" : w === 'joint' ? 'household money' : 'your money'; }

}
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-who-all]')) setWho('all'); });
function whoViewEmpty(when){ // empty state for a list that is empty because of the view
  const w = curWho(); if (w === 'all') return '';
  const nm = w === 'partner' ? peopleNames().partner + "'s" : w === 'joint' ? "the household's" : 'yours';
  const who = w === 'partner' ? 'of ' + peopleNames().partner + "'s" : w === 'joint' ? 'for the household' : 'of yours';

  const n = personName(w);
  return `<div class="k-card" style="margin-bottom:var(--space-4)">${emptyHtml('No accounts for ' + escapeHtml(n) + ' yet', 'Everything here fills in once there is one.', addAcctBtn('Add an account for ' + escapeHtml(n), '&o=' + w))}</div>`;

document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-setup-savings]'); if (t){ const num = id => { const el = document.getElementById(id); if (!el) return null; const v = parseFloat(el.value); return isNaN(v) ? null : v; }; const d = startSavings() || {};
    setupSavings({balance: num('sv-bal') ?? d.balance ?? 0, monthly: num('sv-mo') ?? d.monthly ?? 0, comfort: num('sv-cf') ?? d.comfort ?? 2000}); return; }

/* ---------------------- AUTH ---------------------- */
document.getElementById('btn-signin').onclick = () => {

if (firebaseConfig.apiKey !== "YOUR_API_KEY") {

/* ---------------------- FIRESTORE LISTENERS ---------------------- */
function attachListeners(){

  unsubscribers.push(base.collection('categories').orderBy('order').onSnapshot(snap => {
    categories = snap.docs.map(d => ({id:d.id, ...d.data()})); dataReady.categories = true;
    renderBudgets(); renderDashboard(); renderForecast(); renderTransactions();
    if (routeNow.screen === 'category') route();

  }));

  unsubscribers.push(base.collection('transactions').orderBy('date','desc').onSnapshot(snap => {
    transactions = snap.docs.map(d => ({id:d.id, ...d.data()})); dataReady.transactions = true;
    renderBudgets(); renderDashboard(); renderForecast(); renderTransactions(); renderStatementCoverage();
    if (routeNow.sheet && !document.querySelector('#sheet-host .k-sheet')) showSheet(routeNow.sheet, routeNow.sheetId);
  }));

  unsubscribers.push(base.collection('bills').orderBy('dueDate').onSnapshot(snap => {
    bills = snap.docs.map(d => ({id:d.id, ...d.data()})); dataReady.bills = true;
    renderBills(); renderVat(); renderMoney(); renderDashboard(); renderPlan();
    if (routeNow.sheet && !document.querySelector('#sheet-host .k-sheet')) showSheet(routeNow.sheet, routeNow.sheetId);
  }));

  unsubscribers.push(base.collection('plannedExpenses').orderBy('date').onSnapshot(snap => {
    plannedExpenses = snap.docs.map(d => ({id:d.id, ...d.data()})); dataReady.planned = true;
    renderPlanned(); renderForecast(); renderDashboard();
    if (routeNow.sheet && !document.querySelector('#sheet-host .k-sheet')) showSheet(routeNow.sheet, routeNow.sheetId);
  }));

  unsubscribers.push(base.collection('settings').doc('businessForecast').onSnapshot(snap => {
    if (!snap.exists) return;
    try {
      const d = JSON.parse(snap.data().data); d._importedAt = snap.data().importedAt || null;
      if (!validateBusinessForecast(d)){ businessForecast = d; try { localStorage.setItem(BF_KEY, JSON.stringify(d)); } catch(e){} renderBusiness(); renderForecast(); }
    } catch(e){}
  }, () => {}));

  unsubscribers.push(base.collection('accounts').onSnapshot(snap => {
    accounts = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if (!accounts.length && !backupOk()) accounts = LEGACY_ACCOUNTS.map(a => Object.assign({archived:false, virtual:true}, a));
    indexAccounts(); seedAccountsOnce(snap); updateBackupBanner();
    refreshAccountViews();
  }));
  unsubscribers.push(base.collection('money').doc('profile').onSnapshot(snap => { moneyProfile = snap.exists ? snap.data() : {}; renderMoney(); renderDashboard(); const h = document.getElementById('sheet-host'); if (routeNow.sheet === 'moneyyou' && h && h.querySelector('.k-sheet')) SHEETS.moneyyou(h); }, () => {}));
  unsubscribers.push(base.collection('money').doc('state').onSnapshot(snap => { moneyState = snap.exists ? snap.data() : {}; renderMoney(); renderDashboard(); }, () => {}));
  fetch('/deals.json', {cache: 'no-cache'}).then(r => (r.headers.get('content-type') || '').includes('json') ? r.json() : null).then(j => { if (j && j.deals){ moneyFeedFile = j; renderMoney(); renderDashboard(); } }).catch(() => {});
  unsubscribers.push(base.collection('settings').doc('researchStatus').onSnapshot(snap => { researchStatus = snap.exists ? snap.data() : null; renderSettings(); }, () => {}));
  unsubscribers.push(base.collection('settings').doc('dealsFeed').onSnapshot(snap => { dealsFeed = snap.exists ? snap.data() : null; renderSettings(); renderMoney(); renderDashboard(); }, () => {}));
  unsubscribers.push(base.collection('questions').onSnapshot(snap => {
    questions = snap.docs.map(d => ({id:d.id, ...d.data()})); renderTransactions(); if (askRefresh) askRefresh();
  }, () => {}));
  unsubscribers.push(base.collection('statements').onSnapshot(snap => {
    statements = snap.docs.map(d => ({id:d.id, ...d.data()})); stmtReady = true; refreshAccountViews();
  }, () => {}));

  unsubscribers.push(base.collection('settings').doc('profile').onSnapshot(snap => {
    settingsDoc = snap.exists ? snap.data() : {};
    renderShell(); renderSettings(); renderDashboard(); renderAccounts(); renderTransactions(); renderCard();
    renderForecast(); renderMoney();
  }));
}
let scanDone = false, stmtReady = false;
function maybeScan(){ if (scanDone || !uid || !accounts.length || !stmtReady || !dataReady.transactions) return; scanDone = true; loadFolder().then(scanFolder).catch(()=>{}); }

/* ---------------------- DUPLICATE DETECTION ---------------------- */
// Two transactions are a "suspected duplicate" if they share the same date,
// the same amount (to the penny), and their descriptions are a close match
// (either one contains the other, once case/punctuation is stripped).
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normDesc(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function looksLikeDuplicate(a, b){
  if (a.date !== b.date) return false;
  if (Math.abs(a.amount) !== Math.abs(b.amount)) return false;
  if (a.kind === 'transfer' && b.kind === 'transfer') return false;                       // the two halves of a transfer are not duplicates
  if ((a.accountId || b.accountId) && (a.amount > 0) !== (b.amount > 0)) return false;     // money in vs money out
  if (a.accountId && b.accountId && a.accountId !== b.accountId) return false;
  const da = normDesc(a.description), db = normDesc(b.description);
  if (!da || !db) return false;
  return da === db || da.includes(db) || db.includes(da);
}
// Finds saved-transaction ids that look like duplicates of each other, restricted to `pool`.
// Returns a Set of ids that are involved in at least one duplicate pair.
function findDuplicateIdsIn(pool){
  const flagged = new Set();
  const active = pool.filter(t => !t.dupIgnored);
  for (let i=0; i<active.length; i++){
    for (let j=i+1; j<active.length; j++){
      if (looksLikeDuplicate(active[i], active[j])){
        flagged.add(active[i].id); flagged.add(active[j].id);
      }
    }
  }
  return flagged;
}
// For the upload preview: flags NEW rows that match something already saved in Firestore
// (any month, not just the one being viewed) — catches re-uploading an overlapping statement.
function findRowsMatchingExisting(newRows){
  const matches = new Array(newRows.length).fill(false);
  newRows.forEach((row, i) => {
    if (transactions.some(existing => looksLikeDuplicate(row, existing))) matches[i] = true;
  });
  return matches;
}

function transferWord(t){ const k = hhOn() ? whoseOf(t).k : ''; return k === 'cme' || k === 'cjo' || k === 'sent' ? 'Contribution' : k === 'split' ? 'Card payment' : 'Transfer'; }

function applyTxnFilter(rows, f, dupIds){
  const parts = String(f || 'all').split(',').filter(x => x && x !== 'all');
  if (parts.length > 1) return parts.reduce((r, x) => applyTxnFilter(r, x, dupIds), rows);
  f = parts[0] || 'all';
  if (f === 'household') return rows.filter(t => { const k = whoseOf(t).k; return k === 'joint' || k === 'inc'; });
  if (f === 'mine') return rows.filter(t => { const k = whoseOf(t).k; return k === 'me' || k === 'sent'; });
  if (f === 'contributions') return rows.filter(t => { const k = whoseOf(t).k; return k === 'cme' || k === 'cjo' || k === 'sent'; });
  if (f === 'tosort') return rows.filter(t => whoseOf(t).k === 'none');
  if (f === 'questions') return rows.filter(t => { const q = qOf(t); return q && q.status !== 'done'; });
  if (f === 'uncategorised') return rows.filter(isUncat);
  if (f === 'duplicates') return rows.filter(t => dupIds.has(t.id));
  if (f === 'in') return rows.filter(t => t.amount > 0 && !isTransfer(t));
  if (f === 'out') return rows.filter(t => t.amount < 0 && !isTransfer(t));
  if (f === 'transfers') return rows.filter(isTransfer);
  if (f === 'hide-transfers') return rows.filter(t => !isTransfer(t));
  return rows;
}

    else if (btn.id === 'ask-reply-send' && q){ const text = (box.querySelector('#ask-reply').value || '').trim(); if (!text) return; btn.disabled = true;

/* ---------------------- STATEMENT COVERAGE + MONTHLY REMINDER ---------------------- */
const HOUSEHOLD_ACCOUNTS = ['Lloyds credit card', 'Joint Bank of Scotland'];
function statementCoverage(){
  const now = new Date(); const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevKey = prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0');
  return HOUSEHOLD_ACCOUNTS.map(acc => {
    const months = new Set(transactions.filter(t=>t.account===acc && t.date).map(t=>t.date.slice(0,7)));
    if (!months.size) return {acc, none:true, missing:[prevKey], prevKey};

function parseFile(file){
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  setImportWarn('');
  if (isPdf) {
    parsePdfFile(file); // everything happens client-side — the PDF bytes never leave the browser
  } else {
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: res => {
        rawHeaders = res.meta.fields || [];
        rawRows = res.data;
        showMapping();
      }
    });
  }
  // in both cases the File object is only read into memory here and discarded — never uploaded
}

async function parsePdfFile(file){
  const warnEl = { style:{}, set innerHTML(v){ setImportWarn(v,true); renderStatements(); }, set textContent(v){ setImportWarn(v); renderStatements(); } };
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let lines = [];
    for (let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      lines = lines.concat(groupTextIntoLines(content.items));
    }
    const parsed = extractTransactionsFromLines(lines);
    if (!parsed.length){
      warnEl.style.display = 'block';
      warnEl.innerHTML = 'Couldn\'t find transaction-shaped lines in that PDF — it may be a scanned image rather than real text, ' +
        'or laid out in a way this simple parser doesn\'t recognise. Try the "paste transactions" option below instead, ' +
        'or export a CSV from your bank\'s website if that\'s available.';
      return;
    }
    mappedRows = parsed;
    if (parsed.some(r => r.uncertainSign)){
      warnEl.style.display = 'block';
      warnEl.innerHTML = 'PDF layout doesn\'t always make it clear whether an amount is money in or money out — ' +
        'check the amounts and use “Flip money in/out” on any that are the wrong way round before saving.';
    } else setImportWarn('');
    startPreview();
  } catch (err) {
    warnEl.style.display = 'block';
    warnEl.textContent = 'Could not read that PDF (' + err.message + '). Try the "paste transactions" option instead.';
  }
}

// Groups pdf.js text items into visual lines by their y-position, left-to-right.
function groupTextIntoLines(items){
  const rows = {};
  items.forEach(it => {
    const y = Math.round(it.transform[5]);
    if (!rows[y]) rows[y] = [];
    rows[y].push(it);
  });
  return Object.keys(rows)
    .sort((a,b) => b - a) // top of page first
    .map(y => rows[y].sort((a,b) => a.transform[4]-b.transform[4]).map(it=>it.str).join(' ').replace(/\s+/g,' ').trim())
    .filter(Boolean);
}

// Heuristic line parser used for both PDF-extracted lines and pasted text.
// Handles two shapes:
//  1) Bank statements with an explicit Type column (DD, DEB, FPO, FPI, SO, etc.)
//     — e.g. Bank of Scotland/Lloyds-style layouts. When detected, ONLY rows
//     typed DD (Direct Debit) or DEB (Debit Card) are kept — transfers (FPO/FPI),
//     interest, and anything else are deliberately excluded, and the amount used
//     is always treated as money OUT (DD/DEB are never money in).
//  2) Plain statements with no Type column — falls back to finding a date
//     anywhere in the line plus the last money-shaped number as the amount.
const MONTHS = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const TYPE_CODES = ['BGC','BP','CHG','CHQ','COR','CPT','DD','DEB','DEP','FEE','FPI','FPO','MPI','MPO','PAY','SO','TFR'];
const INCLUDE_TYPES = ['DD','DEB']; // only direct debits and debit-card payments count as spend
const typeRe = new RegExp('\\b(' + TYPE_CODES.join('|') + ')\\b');

function plausibleYear(y){ const cy = new Date().getFullYear(); return y >= cy - 8 && y <= cy + 1; }
function findMonthNameDates(text){
  const re = /((\d{1,2})\s+([A-Za-z]{3,9}))(?:\s*(\d{2,4})\b)?/g;

    <section class="k-section"><div class="k-section__head"><h2>Money in accounts</h2>${lastBal ? `<span class="muted" style="margin-left:auto;margin-right:var(--space-3)">to ${escapeHtml(shortDate(lastBal.slice(0,10)))}</span>` : ''}<a class="k-link hit" href="/accounts">All ${liveAccounts().length}</a></div>
      <div class="k-card" style="padding:0 var(--space-4)"><div class="flat-list">${owners.map(o => `<a class="k-item" href="/accounts" style="min-height:56px">${whoBadge(o)}<div class="k-item__text"><span class="k-item__title">${escapeHtml(ownerName(o))}</span><span class="k-item__meta">${acctsOf(o).length} account${acctsOf(o).length===1?'':'s'}</span></div><span class="k-amount tnum">${money(ownerTotalOf(o))}</span></a>`).join('') || `<div style="padding:8px 0">${emptyHtml('Your accounts and what is in them', virtualAccounts() ? 'Download a backup and your two accounts are set up.' : 'No accounts yet.', addAcctBtn('Add account'))}</div>`}</div></div></section>
    ${!stat.length ? `<section class="k-section"><div class="k-section__head"><h2>Savings</h2><a class="k-link hit" href="/plan">Plan</a></div><div class="k-card">${savingsEmptyHtml()}</div></section>` : ''}${stat.length ? `<section class="k-section"><div class="k-section__head"><h2>Savings</h2><a class="k-link hit" href="/plan?who=${w==='all'?'all':w}">Plan</a></div><div class="k-card" style="padding:0 var(--space-4)"><div class="flat-list">${stat.map(x => `<a class="k-item" href="/plan?who=${x.a.owner}" style="min-height:56px">${whoBadge(x.a.owner)}<div class="k-item__text"><span class="k-item__title">${escapeHtml(x.a.name)}</span><span class="k-item__meta">Lowest ${money(x.p.low.v,{dp:0})}${x.p.low.i ? ' in ' + escapeHtml(monthShort(x.p.pts[x.p.low.i].mk)) : ''} · comfort ${money(x.p.comfort,{dp:0})}</span></div><span class="k-item__trail">${x.ok ? `<span class="pill-ok">${icon('check',16)}OK</span>` : '<span class="k-tag k-tag--negative">Low</span>'}</span></a>`).join('')}</div></div>
      ${nextBuy ? `<a class="k-card" href="/plan/buys" style="text-decoration:none;color:inherit;padding:var(--space-4);display:flex;flex-direction:column;gap:6px;margin-top:var(--space-3)"><div class="row between"><span class="row" style="gap:10px"><span class="goal__emoji" style="width:36px;height:36px">${icon(nextBuy.icon,20)}</span><span><span class="k-label" style="display:block">Next planned buy</span><b style="font-weight:600">${escapeHtml(nextBuy.name)} · ${escapeHtml(monthLong(nextBuy.month))}</b></span></span><span class="k-amount tnum">${money(-nextBuy.amount,{dp:0})}</span></div></a>` : `<div class="k-card" style="margin-top:var(--space-3)">${emptyHtml('Plan a buy to see what it does to your savings', 'Nothing is planned yet.', '<button class="k-btn" type="button" data-open-sheet="buy">Plan a buy</button>')}</div>`}</section>` : ''}
    </div></div>`;
  selectedMonth = prevSel;
}

let userEmail = '';
/* ---------------------- ACCOUNTS SCREEN ---------------------- */
function acctRowHtml(a, waiting){
  const bal = accountBalance(a), owed = a.type === 'credit';
  const upd = lastUpdatedText(a);
  const sub = bal == null ? 'No balance yet' : owed ? (a.creditLimit ? `owed of ${money(a.creditLimit,{dp:0})}` : 'owed') : a.type === 'savings' ? (a.comfortLine ? `comfort line ${money(a.comfortLine,{dp:0})}` : 'Savings') : (a.balanceSource === 'worked-out' ? 'worked out from transactions' : 'latest balance');
  const stat = waiting ? `<span class="k-tag k-tag--warn">Waiting for ${escapeHtml(monthName(prevMonthKey()).split(' ')[0])}</span>` : (upd ? `<span class="pill-ok">${icon('check',16)}Updated ${escapeHtml(upd)}</span>` : (a.type==='savings' ? `<span class="muted">Balance set by hand</span>` : '<span class="muted">No file yet</span>'));
  const act = waiting ? `<a class="k-btn k-btn--sm" href="/inbox">How to get it</a>` : `<a class="k-btn k-btn--ghost k-btn--sm" href="/accounts?sheet=account&id=${encodeURIComponent(a.id)}" aria-label="Open ${escapeHtml(a.name)}">${icon('chevron-right')}</a>`;
  return `<div class="acct-row"><div class="acct-row__name">${whoBadge(a.owner)}<div style="min-width:0"><div class="acct__name">${escapeHtml(a.name)}</div><div class="acct__bank">${escapeHtml([a.bank, TYPE_NAME[a.type]].filter(Boolean).join(' · '))}${a.last4 ? ' · ····' + escapeHtml(a.last4) : ''}</div></div></div>
  <div class="acct-row__bal"><div class="tnum" style="font-weight:600;font-size:17px">${bal==null?'–':money(Math.abs(bal))}</div><div class="hint">${escapeHtml(sub)}</div></div>
  <div class="acct-row__stmt">${stat}</div><div class="acct-row__act">${act}</div></div>`;
}
function renderAccounts(){
  const root = document.getElementById('accounts-root'); if (!root) return;
  if (!accounts.length){ root.innerHTML = skeleton(); return; }
  const wait = new Set(waitingAccounts().map(a => a.id)), cur = curWho('accounts');
  const owners = ['joint','me','partner'].filter(o => cur === 'all' || cur === o);
  const desc = {joint:'Shared by both of you. Household budgets and bills come from here.', me:'Your own accounts.', partner:'Their own accounts.'};
  root.innerHTML = owners.map(o => { const list = acctsOf(o);
    return `<section class="k-section"><div class="k-section__head owner-head"><h2 class="row" style="gap:10px">${whoBadge(o)}${escapeHtml(ownerName(o))}<span class="muted tnum" style="font-weight:400;font-size:15px">${money(ownerTotalOf(o))}</span></h2><span class="muted">${escapeHtml(desc[o])}</span></div>
    ${list.length ? `<div class="k-card acct-list">${list.map(a => acctRowHtml(a, wait.has(a.id))).join('')}</div>` : `<div class="k-card">${emptyHtml('No accounts here yet', 'Add one and its statements will land here.', addAcctBtn(o === 'joint' ? 'Add account' : 'Add an account for ' + escapeHtml(personName(o)), '&o=' + o))}</div>`}</section>`; }).join('');
}
function accountsSub(){ const n = liveAccounts().length, upd = statements.map(s => s.importedAt).filter(Boolean).sort().pop(); return n + ' account' + (n===1?'':'s') + (upd ? ' · updated ' + lastStampText(upd) : ''); }
function lastStampText(iso){ const d = new Date(iso); if (isNaN(d)) return ''; const same = d.toDateString() === new Date().toDateString(); return same ? 'today at ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

/* Add / open an account */
SHEETS.account = (host, id) => {
  const a = id ? accounts.find(x => x.id === id) : null;
  if (id && !a){ host.style.display = 'none'; host.innerHTML = ''; if (accounts.length) dropSheetFromUrl(); return; }
  const qp = new URLSearchParams(location.search), n = peopleNames(), st = {type: a ? a.type : (['current','credit','savings'].includes(qp.get('t')) ? qp.get('t') : 'current'), owner: a ? a.owner : (['joint','me','partner'].includes(qp.get('o')) ? qp.get('o') : curWho('accounts') === 'me' || curWho('accounts') === 'partner' ? curWho('accounts') : 'joint')};
  const seg = (name, opts, cur) => `<div class="k-seg" role="group" data-seg="${name}">${opts.map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${v===cur}">${escapeHtml(l)}</button>`).join('')}</div>`;
  const rules = a && a.rules ? a.rules : {};
  host.innerHTML = sheetShell(a ? escapeHtml(a.name) : 'Add an account', `
    <label class="k-field"><span>Name</span><div class="k-field__box"><input id="ac-name" value="${a ? escapeHtml(a.name) : ''}" placeholder="For example Joint savings"></div></label>
    <div class="stack" style="gap:6px"><span class="k-label">Type</span>${seg('type',[['current','Current'],['credit','Credit card'],['savings','Savings']], st.type)}</div>
    <div class="stack" style="gap:6px"><span class="k-label">Whose is it?</span>${seg('owner',[['joint','Joint'],['me','Mine'],['partner', n.partner + "'s"]], st.owner)}<span class="hint">Joint accounts feed the household budget. Personal ones feed that person's budget.</span></div>
    <div class="row" style="align-items:flex-start;flex-wrap:wrap"><label class="k-field" style="flex:1;min-width:160px"><span>Bank</span><div class="k-field__box"><input id="ac-bank" value="${a ? escapeHtml(a.bank||'') : ''}" placeholder="Bank"></div></label>
      <label class="k-field" style="flex:1;min-width:160px"><span>${st.type==='credit'?'Amount owed today':'Balance today'}</span><div class="k-field__box"><span>£</span><input id="ac-bal" type="number" step="0.01" inputmode="decimal" value="${a && accountBalance(a)!=null ? Math.abs(accountBalance(a)) : ''}"></div></label></div>
    <label class="k-field"><span>Last 4 digits of the account or card number</span><div class="k-field__box"><input id="ac-last4" value="${a ? escapeHtml(a.last4||'') : ''}" inputmode="numeric" maxlength="4"></div><span class="hint">This is how the inbox knows a file belongs to this account, whatever the file is called.</span></label>
    <div id="ac-credit" ${st.type==='credit'?'':'hidden'}><label class="k-field"><span>Credit limit (optional)</span><div class="k-field__box"><span>£</span><input id="ac-limit" type="number" inputmode="decimal" value="${a && a.creditLimit ? a.creditLimit : ''}"></div></label></div>
    <div id="ac-save" class="row" style="align-items:flex-start;flex-wrap:wrap" ${st.type==='savings'?'':'hidden'}><label class="k-field" style="flex:1;min-width:160px"><span>Comfort line</span><div class="k-field__box"><span>£</span><input id="ac-comfort" type="number" inputmode="decimal" value="${a && a.comfortLine!=null ? a.comfortLine : ''}"></div><span class="hint">The balance you never want to go below.</span></label>
      <label class="k-field" style="flex:1;min-width:160px"><span>Saved each month</span><div class="k-field__box"><span>£</span><input id="ac-monthly" type="number" inputmode="decimal" value="${a && a.monthlySaving!=null ? a.monthlySaving : ''}"></div></label></div>
    <label class="k-toggle"><span class="k-toggle__text"><span style="font-weight:500">Remind us if no file arrives</span><span class="hint">Shows in To do after the 5th of each month</span></span><span class="k-switch"><input type="checkbox" id="ac-remind" ${!a || a.remindStatements !== false ? 'checked':''}><span></span></span></label>
    ${a ? `<details class="k-card rules"><summary class="row between"><span class="h-card">Rules for this account</span><span class="muted">${icon('chevron-right',16)}</span></summary>
      <label class="k-field"><span>Card payments or transfers look like</span><div class="k-field__box"><input id="ac-tp" value="${escapeHtml((rules.transferPatterns||[]).join(', '))}" placeholder="for example PAYMENT RECEIVED, FASTER PAYMENT"></div><span class="hint">Words separated by commas. A line with any of them is treated as a transfer.</span></label>
      <label class="k-field"><span>Keywords that always go to a budget, on this account only</span><div class="k-field__box"><textarea id="ac-ko" rows="3" placeholder="coffee = Eating out">${escapeHtml(Object.entries(rules.keywordOverrides||{}).map(([k,v]) => k + ' = ' + v).join('\n'))}</textarea></div><span class="hint">One per line: word = budget name.</span></label></details>` : ''}`,
    `${a ? `<button class="k-btn k-btn--danger" type="button" id="ac-del">Hide account</button>` : '<button class="k-btn k-btn--ghost" type="button" data-sheet-close>Cancel</button>'}<button class="k-btn k-btn--primary" type="button" id="ac-go">${a ? 'Save' : 'Add account'}</button>`);
  host.querySelectorAll('[data-seg]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); st[g.dataset.seg] = b.dataset.v;
    host.querySelector('#ac-credit').hidden = st.type !== 'credit'; host.querySelector('#ac-save').hidden = st.type !== 'savings'; }));
  const num = s => { const v = parseFloat(host.querySelector(s).value); return isNaN(v) ? null : v; };
  host.querySelector('#ac-go').onclick = () => {
    const name = host.querySelector('#ac-name').value.trim(); if (!name){ host.querySelector('#ac-name').focus(); return; }
    let bal = num('#ac-bal'); if (bal != null && st.type === 'credit') bal = -Math.abs(bal);
    const data = {name, bank: host.querySelector('#ac-bank').value.trim(), type: st.type, owner: st.owner, last4: host.querySelector('#ac-last4').value.replace(/\D/g,'').slice(0,4),
      remindStatements: host.querySelector('#ac-remind').checked, archived: false};
    if (bal != null && (!a || bal !== accountBalance(a))){ data.balance = bal; data.balanceDate = new Date().toISOString(); data.balanceSource = 'manual'; }
    if (st.type === 'credit'){ const l = num('#ac-limit'); if (l != null) data.creditLimit = l; }
    if (st.type === 'savings'){ const c = num('#ac-comfort'), m = num('#ac-monthly'); if (c != null) data.comfortLine = c; if (m != null) data.monthlySaving = m; }
    if (a){
      const tp = host.querySelector('#ac-tp'), ko = host.querySelector('#ac-ko');
      const ov = {}; (ko.value||'').split('\n').forEach(l => { const m = l.split('='); if (m.length >= 2 && m[0].trim()) ov[m[0].trim().toLowerCase()] = m.slice(1).join('=').trim(); });
      data.rules = {transferPatterns: (tp.value||'').split(',').map(s => s.trim()).filter(Boolean), keywordOverrides: ov};
    } else { data.order = accounts.length + 1; data.rules = {transferPatterns: [], keywordOverrides: {}}; }
    if (virtualAccounts()){ toast('Download a backup first.'); return; }
    (a ? usersCol().collection('accounts').doc(a.id).update(data) : usersCol().collection('accounts').add(data)).then(() => closeSheet()).catch(saveFail);
  };
  const del = host.querySelector('#ac-del');
  if (del) del.onclick = () => {
    if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = 'Tap again to hide it'; return; }
    usersCol().collection('accounts').doc(a.id).update({archived:true}).then(() => { toastUndo('Account hidden. Its transactions stay.', () => usersCol().collection('accounts').doc(a.id).update({archived:false})); }).catch(saveFail); closeSheet();
  };
};

function researchCardHtml(){
  const r = researchStatus, f = dealsFeed, when = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) + ' ' + d.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}); };
  const state = !r ? 'Not run yet' : r.state === 'running' ? 'Running now' : r.state === 'ok' ? 'Last run worked' : r.state === 'error' ? 'Last run failed' : r.state === 'dry-run-ok' ? 'Setup check passed' : r.state;
  const rows = [['Status', state], r && r.finishedAt ? [r.state === 'dry-run-ok' ? 'Last checked' : 'Last run', when(r.finishedAt) + (r.state === 'dry-run-ok' ? ' · setup OK' : '')] : null, f ? ['Deals in the feed', String(f.count || (f.deals || []).length)] : null, r && r.costUsd != null ? ['Cost of the last run', '$' + Number(r.costUsd).toFixed(2) + (r.searches ? ' · ' + r.searches + ' searches' : '')] : null, r && r.plan ? ['Cost cap per run', '$' + Number(r.plan.capUsd).toFixed(2)] : null].filter(Boolean);
  return `<div class="k-card"><h2 class="card-h">Research engine</h2><p class="muted">Every night the app looks up public deals (bank switches, energy, broadband, mobile, insurance, cashback). Only public facts are sent; matching against your own accounts happens here, in your browser.</p>
    <dl class="k-dl">${rows.map(x => `<dt>${escapeHtml(x[0])}</dt><dd>${escapeHtml(x[1])}</dd>`).join('')}</dl>
    ${r && r.error ? `<div class="k-banner k-banner--warn">${icon('warning')}<span style="flex:1">${escapeHtml(r.error)}</span></div>` : ''}
    <div class="row" style="margin-top:var(--space-3)"><button class="k-btn" type="button" id="research-run"${r && r.state === 'running' ? ' disabled' : ''}>Run now</button><button class="k-btn k-btn--ghost" type="button" id="research-check">Check setup</button></div>
    <p class="hint">Runs by itself around 02:30. The key and the cost cap live in the hosting settings, not in the app.</p></div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('#research-run, #research-check'); if (!b) return;
  b.disabled = true;
  try { const tok = await auth().currentUser.getIdToken(), r = await fetch('/api/research', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + tok}, body: JSON.stringify({dry: b.id === 'research-check'})});
    if (!(r.headers.get('content-type') || '').includes('json') && r.status !== 202 && r.status !== 200) throw new Error(String(r.status));
    toast(b.id === 'research-check' ? 'Checking the setup' : 'Research started. It takes a few minutes.'); } catch (err){ toast('Could not start. The research engine is not switched on yet.'); }
  setTimeout(() => { b.disabled = false; }, 4000);
});
function renderSettings(){
  const root = document.getElementById('settings-root'); if (!root) return;
  const canNotify = typeof Notification !== 'undefined', on = canNotify && Notification.permission === 'granted';
  root.innerHTML = `<div class="stack" style="max-width:640px">
    <div class="k-card"><h2 class="card-h">Account</h2><div class="row"><span class="k-avatar k-avatar--lg" aria-hidden="true">${escapeHtml((userEmail||'?').charAt(0).toUpperCase())}</span><div class="k-item__text" style="flex:1"><span class="k-item__title">Signed in</span><span class="k-item__meta">${escapeHtml(userEmail)}</span></div><button class="k-btn" type="button" id="btn-signout">Sign out</button></div></div>
    <div class="k-card"><h2 class="card-h">The two of you</h2>
      <div class="row" style="flex-wrap:wrap;align-items:flex-start"><label class="k-field" style="flex:1;min-width:180px"><span>Your name</span><div class="k-field__box"><input id="set-me" value="${escapeHtml((settingsDoc.people||{}).me||'')}" placeholder="Me" autocomplete="off"></div></label>
      <label class="k-field" style="flex:1;min-width:180px"><span>Their name</span><div class="k-field__box"><input id="set-partner" value="${escapeHtml((settingsDoc.people||{}).partner||'')}" placeholder="Partner" autocomplete="off"></div></label></div>
      <label class="k-field"><span>Their email (to ask them about a transaction)</span><div class="k-field__box"><input id="set-partner-email" type="email" inputmode="email" value="${escapeHtml((settingsDoc.people||{}).partnerEmail||'')}" placeholder="name@example.com" autocomplete="off"></div></label>
      <p class="hint">${(settingsDoc.people||{}).partner ? 'Shown on account badges and in "Showing". Initials come from these names.' : "Add your partner's name so the app uses it everywhere."}</p></div>
    <div class="k-card"><h2 class="card-h">Accounts</h2><p class="muted">${liveAccounts().length} accounts. Add, change or hide them on the Accounts screen.</p><a class="k-btn" href="/accounts">Open Accounts</a></div>
    <div class="k-card"><h2 class="card-h">Household</h2><p class="muted">Who pays into the joint account each month, and how the Lloyds card is split.</p><button class="k-btn" type="button" data-open-sheet="household">${hhOn() ? 'Change who pays in' : 'Set up who pays in'}</button></div>
    ${researchCardHtml()}
    <div class="k-card"><h2 class="card-h">Backup</h2><p class="muted">Download everything in Kodu Finance as one file you can keep. Do this before big changes.</p><button class="k-btn" type="button" id="btn-backup">Download a backup</button></div>
    <div class="k-card"><h2 class="card-h">Reminders</h2><label class="k-toggle"><span class="k-toggle__text"><span>Bill reminders on this device</span><span class="hint">${canNotify ? 'Only while Kodu Finance is open in a tab' : 'This browser can\'t show reminders'}</span></span><span class="k-switch"><input type="checkbox" id="notif-switch"${on?' checked':''}${canNotify?'':' disabled'}><span></span></span></label></div>
    <p class="hint">Kodu Finance ${escapeHtml(APP_VERSION)} · Your data is only readable by the two of you.</p></div>`;
}
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#btn-signout')){ auth().signOut(); } if (e.target.closest && e.target.closest('#btn-backup, #btn-backup-first, [data-backup]')) downloadBackup(); });
document.addEventListener('change', e => {
  if (e.target.id !== 'set-me' && e.target.id !== 'set-partner' && e.target.id !== 'set-partner-email') return;
  const me = document.getElementById('set-me').value.trim(), pa = document.getElementById('set-partner').value.trim(), em = document.getElementById('set-partner-email').value.trim();
  usersCol().collection('settings').doc('profile').set({people: {me, partner: pa, partnerEmail: em}}, {merge:true}).then(() => toast('Names saved')).catch(saveFail);
});
async function downloadBackup(){
  const btn = document.getElementById('btn-backup'); if (btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try {
    const out = {app:'Kodu Finance', version: APP_VERSION, exportedAt: new Date().toISOString(), collections:{}};
    for (const name of ['categories','transactions','bills','plannedExpenses','accounts','statements']){
      const snap = await usersCol().collection(name).get(); out.collections[name] = snap.docs.map(d => ({id:d.id, data:d.data()}));
    }
    const st = await usersCol().collection('settings').get(); out.collections.settings = st.docs.map(d => ({id:d.id, data:d.data()}));
    const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'kodu-finance-backup-' + new Date().toISOString().slice(0,10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    try { localStorage.setItem('kodu-backup-ok','1'); } catch(e){} toast('Backup downloaded');
    if (virtualAccounts()){ seedAccountsOnce.done = false; accounts = []; usersCol().collection('accounts').get().then(seedAccountsOnce).catch(()=>{}); }
  } catch(e){ toast("Couldn't make the backup. Try again."); }
  if (btn){ btn.disabled = false; btn.textContent = 'Download a backup'; }
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'notif-switch') return;
  if (e.target.checked){ try { await Notification.requestPermission(); } catch(err){} }
  else toast('To turn reminders off, change it in your browser\'s site settings.');
  renderSettings();
});

route();
</script>
